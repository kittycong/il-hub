<title>업무허브 김*원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ground:#F3F5F2; --surface:#FFFFFF; --sunk:#E9EDE8; --line:#D5DCD5; --line-strong:#B9C3BA;
  --ink:#1B2420; --ink-2:#4F5C55; --ink-3:#7A867F;
  --accent:#1F5F6B; --accent-ink:#FFFFFF; --accent-soft:#DCEBEC;
  --stamp:#B23A2E; --stamp-soft:#F6E1DD;
  --warn:#9A6A12; --warn-soft:#F5EACF;
  --ok:#2E6B3F; --ok-soft:#DDEEDF;
  --cat-tax:#7A4E9E; --cat-pay:#1F5F6B; --cat-ins:#2E6B3F; --cat-acc:#9A6A12; --cat-don:#B4527A; --cat-etc:#5E6A64; --cat-leave:#3E7CB1; --cat-bday:#C0673A;
  --paper:#FFFFFF; --paper-ink:#111;
  --shadow:0 1px 2px rgba(20,35,30,.06),0 4px 14px rgba(20,35,30,.06);
  --radius:10px;
  --f-display:"Hahmlet","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121716; --surface:#1A211F; --sunk:#222B28; --line:#2E3935; --line-strong:#43504B;
    --ink:#E4EBE7; --ink-2:#A9B6AF; --ink-3:#7F8C86;
    --accent:#72B6C2; --accent-ink:#0E1A1C; --accent-soft:#1E3538;
    --stamp:#E57A6C; --stamp-soft:#3A2220;
    --warn:#D9AE55; --warn-soft:#352C18;
    --ok:#7CC08E; --ok-soft:#1C3222;
    --cat-tax:#B794D6; --cat-pay:#72B6C2; --cat-ins:#7CC08E; --cat-acc:#D9AE55; --cat-don:#E08DB0; --cat-etc:#9AA7A1; --cat-leave:#86B6E0; --cat-bday:#E59A6E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121716; --surface:#1A211F; --sunk:#222B28; --line:#2E3935; --line-strong:#43504B;
  --ink:#E4EBE7; --ink-2:#A9B6AF; --ink-3:#7F8C86;
  --accent:#72B6C2; --accent-ink:#0E1A1C; --accent-soft:#1E3538;
  --stamp:#E57A6C; --stamp-soft:#3A2220;
  --warn:#D9AE55; --warn-soft:#352C18;
  --ok:#7CC08E; --ok-soft:#1C3222;
  --cat-tax:#B794D6; --cat-pay:#72B6C2; --cat-ins:#7CC08E; --cat-acc:#D9AE55; --cat-don:#E08DB0; --cat-etc:#9AA7A1; --cat-leave:#86B6E0; --cat-bday:#E59A6E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:20px 14px;gap:18px}
.brand{padding:0 8px}
.brand b{display:block;font:700 19px/1.2 var(--f-display);letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 8px}
.main{min-width:0;padding-block:24px 48px;padding-inline:clamp(16px,3vw,40px)}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{margin:0;font:700 clamp(22px,3vw,28px)/1.2 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--ink-2)}
.tabbar{display:none}

@media (max-width: 860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-block:16px 96px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;white-space:nowrap;color:var(--ink-3);text-decoration:none;padding:4px 0;position:relative}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:600}
  .tabbar svg{width:22px;height:22px}
  .tabbar .dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--stamp)}
}

/* ---------- primitives ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2,.panel-h h3{margin:0;font:600 15px/1.3 var(--f-body)}
.panel-b{padding:16px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-2>*,.grid-3>*,.doc-layout>*{min-width:0}
@media (max-width: 980px){.grid-3{grid-template-columns:1fr 1fr}}
@media (max-width: 700px){.grid-2,.grid-3{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--stamp);border-color:var(--stamp)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--stamp-soft);color:var(--stamp)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--stamp);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.dotcat{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2);font-weight:500}
.inp,select.inp,textarea.inp{height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);width:100%;min-width:0;font-size:14px;color:var(--ink)}
textarea.inp{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.form-grid .span2{grid-column:span 2}
@media (max-width: 420px){.form-grid .span2{grid-column:auto}}

.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
.seg a.segl{padding:6px 12px;border-radius:7px;color:var(--ink-2);font-weight:500;font-size:13px;text-decoration:none}
.seg a.segl[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.path-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,2.2fr) auto;gap:8px;align-items:center}
@media (max-width:620px){.path-row{grid-template-columns:1fr;padding-bottom:10px;border-bottom:1px solid var(--line)}}
.st-ph{display:flex;gap:6px;align-items:center;margin-left:auto;flex:0 0 auto}
.st-ph img{width:44px;height:32px;object-fit:cover;border-radius:5px;border:1px solid var(--line);cursor:zoom-in;display:block}
.st-ph .n{font-size:11px;color:var(--ink-3)}
.st-ph .addph{opacity:.35;border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:4px;border-radius:6px}
.steps li:hover .addph,.st-ph .addph:focus-visible{opacity:1}
@media (hover:none){.st-ph .addph{opacity:.6}}
.st-ph .addph svg,.chip svg{width:14px;height:14px;vertical-align:-2px}
.step-paths{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.step-paths button{font-size:11px;height:20px;padding:0 7px;border:0;cursor:pointer}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sp-item{display:flex;flex-direction:column;gap:6px}
.sp-item img{width:100%;max-height:200px;object-fit:contain;background:var(--sunk);border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.drop{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--line-strong);border-radius:10px;padding:14px 16px;cursor:pointer;color:var(--ink-2)}
.drop.on,.drop:hover{border-color:var(--accent);background:var(--accent-soft,var(--sunk))}
.drop svg{width:22px;height:22px;flex:0 0 auto}
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,12,10,.88);display:flex;flex-direction:column;color:#fff}
.lb-bar{display:flex;gap:10px;align-items:center;padding:10px 14px}
.lb-bar .faint{color:#bbb}
.lb-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px}
.lb-body img{max-width:100%;max-height:100%;background:#fff;border-radius:4px;cursor:zoom-in}
.lb.zoom .lb-body{align-items:flex-start;justify-content:flex-start}
.lb.zoom .lb-body img{max-width:none;max-height:none;cursor:zoom-out}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;display:grid;place-items:center}
.lb-nav svg{width:22px;height:22px}.lb-nav.l{left:10px}.lb-nav.r{right:10px}
.run{position:fixed;inset:0;z-index:45;background:var(--ground);display:flex;flex-direction:column}
.run-top{display:flex;gap:10px;align-items:center;padding:12px 16px}
.run-body{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;max-width:980px;width:100%;margin:0 auto}
.run-no{font-size:13px;color:var(--ink-3)}
.run-tx{font:600 clamp(18px,2.4vw,24px)/1.5 var(--f-display,inherit);color:var(--ink)}
.run-ph{display:flex;flex-direction:column;gap:12px}
.run-ph figure{margin:0;display:flex;flex-direction:column;gap:4px}
.run-ph img{max-width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;align-self:flex-start;background:#fff}
.run-foot{display:flex;gap:8px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.run-foot .btn{min-height:44px}
.bg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.bg-kv{display:flex;flex-direction:column;gap:4px}
.bg-kv>div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bg-kv span{font-size:12.5px;color:var(--ink-3);min-width:56px}.bg-kv b{margin-left:auto;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}.bg-kv em{font-style:normal;width:100%;text-align:right}
.bg-kv>div:last-child b{font-size:19px}
.bg-card.empty-f .panel-b{padding-top:10px;padding-bottom:12px}
.neg{color:var(--stamp)!important}
.bgbar{position:relative;flex:1;min-width:80px;height:8px;background:var(--sunk);border-radius:99px}
.bgbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.bgbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);border-radius:2px}
.moncells{display:grid;grid-template-columns:repeat(12,10px);gap:2px}
.moncells i{height:14px;background:var(--accent);border-radius:2px}
.tbl tr.bg-g td{background:var(--sunk)}.tbl tr.bg-h td{color:var(--ink-2)}
.bg-tbl th:first-child,.bg-tbl td:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
.bg-tbl th:first-child{z-index:2;background:var(--sunk)}.tbl tr.bg-g td:first-child{background:var(--sunk)}
@media (max-width:620px){.bg-tbl td.wrap{min-width:130px!important;max-width:150px}}
.bg-tbl td.wrap{white-space:normal;min-width:180px}
.bg-plan .inp{min-width:84px;padding:5px 7px;font-size:13px}.bg-plan .inp.num{min-width:110px;text-align:right}
.bg-plan td{padding:4px 5px}
.nav-sub{display:flex;flex-direction:column;margin:-2px 0 4px 34px;border-left:1px solid var(--line)}
.nav-sub a{font-size:12.5px!important;padding:5px 10px!important;min-height:0!important;color:var(--ink-3)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0 6px 6px 0!important}
.nav-sub a[aria-current="page"]{color:var(--accent)!important;font-weight:600;background:var(--accent-soft)!important}
.app .newtab{position:absolute;top:10px;right:10px;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--ink-3)}
.app .newtab:hover{background:var(--sunk);color:var(--ink)}.app .newtab svg{width:15px;height:15px}
.main.embedding{padding-bottom:0}
.main.embedding .page{gap:8px}
.emb-bar{display:flex;gap:8px;align-items:center}
.emb-chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px}
.emb-chips::-webkit-scrollbar{display:none}
.emb-chip{flex:0 0 auto;padding:6px 12px;border-radius:99px;background:var(--sunk);color:var(--ink-2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap}
.emb-chip[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.emb-note{color:var(--ink-3);padding:2px 2px 0}.emb-note.warn{color:var(--warn)}
#embed-host{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
#embed-host iframe{width:100%;height:100%;border:0;display:block}
#embed-host:fullscreen{border-radius:0}
@media (max-width:860px){.emb-bar{flex-wrap:wrap}.emb-chips{flex:1 1 100%}.emb-bar>.row{margin-left:auto}.emb-bar #emb-full{display:none}.emb-note{font-size:11.5px}#embed-host{margin-inline:-16px;border-radius:0;border-inline:0}}
.ys-tbl .inp{min-width:96px;padding:5px 7px;font-size:13px}.ys-tbl td{padding:5px 6px;vertical-align:middle}
.ys-vouchers{display:flex;flex-direction:column;gap:10px}
.ys-v{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.ys-copy{all:unset;cursor:pointer;padding:6px 10px;border-radius:7px;background:var(--sunk);font-size:13.5px;line-height:1.45;overflow-wrap:anywhere}
.ys-copy:hover,.ys-copy:focus-visible{background:var(--accent-soft);outline:1px solid var(--accent)}
@media (max-width:620px){.ys-v{grid-template-columns:1fr}}
.tool-seg{margin-bottom:4px;align-self:flex-start}
.chip.vfy{background:transparent;border:1px dashed var(--warn,#b7791f);color:var(--warn,#b7791f);height:18px;padding:0 6px;font-size:11px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
.tbl th{background:var(--sunk);font-weight:600;color:var(--ink-2);font-size:12px;position:sticky;top:0}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.wrap{white-space:normal;min-width:160px}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:600;background:var(--sunk)}

.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.note{padding:10px 12px;border-radius:8px;background:var(--sunk);color:var(--ink-2);font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note b{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:860px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

.sheet-back{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet .panel-b{display:flex;flex-direction:column;gap:12px}
.sheet{display:flex;flex-direction:column;overflow:hidden}.sheet>.panel-b{overflow:auto;min-height:0;flex:1 1 auto}.sheet>.panel-h,.sheet>.sheet-foot{flex:0 0 auto}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}

/* ---------- home ---------- */
.today-strip{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:18px 20px}
.datebox{text-align:center;border-right:1px solid var(--line);padding-right:20px}
.datebox .d{font:700 44px/1 var(--f-display);color:var(--accent)}
.datebox .m{font-size:12px;color:var(--ink-3);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi .v{font:600 24px/1.1 var(--f-body);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink-3)}
.kpi.crit .v{color:var(--stamp)} .kpi.warn .v{color:var(--warn)}
@media (max-width:700px){.today-strip{grid-template-columns:1fr}.datebox{border-right:0;border-bottom:1px solid var(--line);padding:0 0 12px;display:flex;align-items:baseline;gap:10px;text-align:left}.kpis{grid-template-columns:repeat(2,1fr)}}

.dl{list-style:none;margin:0;padding:0}
.dl li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.dl li:last-child{border-bottom:0}
.dl .when{font-size:12px;line-height:1.25}
.dl .when b{display:block;font:600 15px/1.2 var(--f-body);font-variant-numeric:tabular-nums}
.dl .t{font-weight:500}
.dl .s{font-size:12px;color:var(--ink-3)}
.dl li.done .t{text-decoration:line-through;color:var(--ink-3)}
