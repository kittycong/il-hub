<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F5F6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="업무허브">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>업무허브 김*원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ground:#F3F5F2; --surface:#FFFFFF; --sunk:#E9EDE8; --line:#D5DCD5; --line-strong:#B9C3BA;
  --ink:#1B2420; --ink-2:#4F5C55; --ink-3:#7A867F;
  --accent:#1F5F6B; --accent-ink:#FFFFFF; --accent-soft:#DCEBEC;
  --stamp:#B23A2E; --stamp-soft:#F6E1DD;
  --warn:#9A6A12; --warn-soft:#F5EACF;
  --ok:#2E6B3F; --ok-soft:#DDEEDF;
  --cat-tax:#7A4E9E; --cat-pay:#1F5F6B; --cat-ins:#2E6B3F; --cat-acc:#9A6A12; --cat-don:#B4527A; --cat-etc:#5E6A64; --cat-leave:#3E7CB1; --cat-bday:#C0673A; --cat-sub:#8A5A3C; --cat-edu:#2F8A74; --cat-insp:#B03A2E; --cat-mtg:#5B5BA8;
  --paper:#FFFFFF; --paper-ink:#111;
  --shadow:0 1px 2px rgba(20,35,30,.06),0 4px 14px rgba(20,35,30,.06);
  --radius:10px;
  --f-display:"Hahmlet","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121716; --surface:#1A211F; --sunk:#222B28; --line:#2E3935; --line-strong:#43504B;
    --ink:#E4EBE7; --ink-2:#A9B6AF; --ink-3:#7F8C86;
    --accent:#72B6C2; --accent-ink:#0E1A1C; --accent-soft:#1E3538;
    --stamp:#E57A6C; --stamp-soft:#3A2220;
    --warn:#D9AE55; --warn-soft:#352C18;
    --ok:#7CC08E; --ok-soft:#1C3222;
    --cat-tax:#B794D6; --cat-pay:#72B6C2; --cat-ins:#7CC08E; --cat-acc:#D9AE55; --cat-don:#E08DB0; --cat-etc:#9AA7A1; --cat-leave:#86B6E0; --cat-bday:#E59A6E; --cat-sub:#C99A78; --cat-edu:#7CCBB8; --cat-insp:#E58A80; --cat-mtg:#A5A5E0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121716; --surface:#1A211F; --sunk:#222B28; --line:#2E3935; --line-strong:#43504B;
  --ink:#E4EBE7; --ink-2:#A9B6AF; --ink-3:#7F8C86;
  --accent:#72B6C2; --accent-ink:#0E1A1C; --accent-soft:#1E3538;
  --stamp:#E57A6C; --stamp-soft:#3A2220;
  --warn:#D9AE55; --warn-soft:#352C18;
  --ok:#7CC08E; --ok-soft:#1C3222;
  --cat-tax:#B794D6; --cat-pay:#72B6C2; --cat-ins:#7CC08E; --cat-acc:#D9AE55; --cat-don:#E08DB0; --cat-etc:#9AA7A1; --cat-leave:#86B6E0; --cat-bday:#E59A6E; --cat-sub:#C99A78; --cat-edu:#7CCBB8; --cat-insp:#E58A80; --cat-mtg:#A5A5E0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:20px 14px;gap:18px}
.brand{padding:0 8px}
.brand b{display:block;font:700 19px/1.2 var(--f-display);letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 8px}
.main{min-width:0;padding-block:24px 48px;padding-inline:clamp(16px,3vw,40px)}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{margin:0;font:700 clamp(22px,3vw,28px)/1.2 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--ink-2)}
.tabbar{display:none}

@media (max-width: 860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-block:16px 96px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;white-space:nowrap;color:var(--ink-3);text-decoration:none;padding:4px 0;position:relative}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:600}
  .tabbar svg{width:22px;height:22px}
  .tabbar .dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--stamp)}
}

/* ---------- primitives ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2,.panel-h h3{margin:0;font:600 15px/1.3 var(--f-body)}
.panel-b{padding:16px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-2>*,.grid-3>*,.doc-layout>*{min-width:0}
@media (max-width: 980px){.grid-3{grid-template-columns:1fr 1fr}}
@media (max-width: 700px){.grid-2,.grid-3{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--stamp);border-color:var(--stamp)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--stamp-soft);color:var(--stamp)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--stamp);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.dotcat{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2);font-weight:500}
.inp,select.inp,textarea.inp{height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);width:100%;min-width:0;font-size:14px;color:var(--ink)}
textarea.inp{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.form-grid .span2{grid-column:span 2}
@media (max-width: 420px){.form-grid .span2{grid-column:auto}}

.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
.seg a.segl{padding:6px 12px;border-radius:7px;color:var(--ink-2);font-weight:500;font-size:13px;text-decoration:none}
.seg a.segl[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.path-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,2.2fr) auto;gap:8px;align-items:center}
@media (max-width:620px){.path-row{grid-template-columns:1fr;padding-bottom:10px;border-bottom:1px solid var(--line)}}
.st-ph{display:flex;gap:6px;align-items:center;margin-left:auto;flex:0 0 auto}
.st-ph img{width:44px;height:32px;object-fit:cover;border-radius:5px;border:1px solid var(--line);cursor:zoom-in;display:block}
.st-ph .n{font-size:11px;color:var(--ink-3)}
.st-ph .addph{opacity:.35;border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:4px;border-radius:6px}
.steps li:hover .addph,.st-ph .addph:focus-visible{opacity:1}
@media (hover:none){.st-ph .addph{opacity:.6}}
.st-ph .addph svg,.chip svg{width:14px;height:14px;vertical-align:-2px}
.step-paths{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.step-paths button{font-size:11px;height:20px;padding:0 7px;border:0;cursor:pointer}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sp-item{display:flex;flex-direction:column;gap:6px}
.sp-item img{width:100%;max-height:200px;object-fit:contain;background:var(--sunk);border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.drop{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--line-strong);border-radius:10px;padding:14px 16px;cursor:pointer;color:var(--ink-2)}
.drop.on,.drop:hover{border-color:var(--accent);background:var(--accent-soft,var(--sunk))}
.drop svg{width:22px;height:22px;flex:0 0 auto}
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,12,10,.88);display:flex;flex-direction:column;color:#fff}
.lb-bar{display:flex;gap:10px;align-items:center;padding:10px 14px}
.lb-bar .faint{color:#bbb}
.lb-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px}
.lb-body img{max-width:100%;max-height:100%;background:#fff;border-radius:4px;cursor:zoom-in}
.lb.zoom .lb-body{align-items:flex-start;justify-content:flex-start}
.lb.zoom .lb-body img{max-width:none;max-height:none;cursor:zoom-out}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;display:grid;place-items:center}
.lb-nav svg{width:22px;height:22px}.lb-nav.l{left:10px}.lb-nav.r{right:10px}
.run{position:fixed;inset:0;z-index:45;background:var(--ground);display:flex;flex-direction:column}
.run-top{display:flex;gap:10px;align-items:center;padding:12px 16px}
.run-body{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;max-width:980px;width:100%;margin:0 auto}
.run-no{font-size:13px;color:var(--ink-3)}
.run-tx{font:600 clamp(18px,2.4vw,24px)/1.5 var(--f-display,inherit);color:var(--ink)}
.run-ph{display:flex;flex-direction:column;gap:12px}
.run-ph figure{margin:0;display:flex;flex-direction:column;gap:4px}
.run-ph img{max-width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;align-self:flex-start;background:#fff}
.run-foot{display:flex;gap:8px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.run-foot .btn{min-height:44px}
.bg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.bg-kv{display:flex;flex-direction:column;gap:4px}
.bg-kv>div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bg-kv span{font-size:12.5px;color:var(--ink-3);min-width:56px}.bg-kv b{margin-left:auto;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}.bg-kv em{font-style:normal;width:100%;text-align:right}
.bg-kv>div:last-child b{font-size:19px}
.bg-card.empty-f .panel-b{padding-top:10px;padding-bottom:12px}
.neg{color:var(--stamp)!important}
.bgbar{position:relative;flex:1;min-width:80px;height:8px;background:var(--sunk);border-radius:99px}
.bgbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.bgbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);border-radius:2px}
.moncells{display:grid;grid-template-columns:repeat(12,10px);gap:2px}
.moncells i{height:14px;background:var(--accent);border-radius:2px}
.tbl tr.bg-g td{background:var(--sunk)}.tbl tr.bg-h td{color:var(--ink-2)}
.bg-tbl th:first-child,.bg-tbl td:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
.bg-tbl th:first-child{z-index:2;background:var(--sunk)}.tbl tr.bg-g td:first-child{background:var(--sunk)}
@media (max-width:620px){.bg-tbl td.wrap{min-width:130px!important;max-width:150px}}
.bg-tbl td.wrap{white-space:normal;min-width:180px}
.bg-plan .inp{min-width:84px;padding:5px 7px;font-size:13px}.bg-plan .inp.num{min-width:110px;text-align:right}
.bg-plan td{padding:4px 5px}
.nav-sub{display:flex;flex-direction:column;margin:-2px 0 4px 34px;border-left:1px solid var(--line)}
.nav-sub a{font-size:12.5px!important;padding:5px 10px!important;min-height:0!important;color:var(--ink-3)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0 6px 6px 0!important}
.nav-sub a[aria-current="page"]{color:var(--accent)!important;font-weight:600;background:var(--accent-soft)!important}
.app .newtab{position:absolute;top:10px;right:10px;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--ink-3)}
.app .newtab:hover{background:var(--sunk);color:var(--ink)}.app .newtab svg{width:15px;height:15px}
.main.embedding{padding-bottom:0}
.main.embedding .page{gap:8px}
.emb-bar{display:flex;gap:8px;align-items:center}
.emb-chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px}
.emb-chips::-webkit-scrollbar{display:none}
.emb-chip{flex:0 0 auto;padding:6px 12px;border-radius:99px;background:var(--sunk);color:var(--ink-2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap}
.emb-chip[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.emb-note{color:var(--ink-3);padding:2px 2px 0}.emb-note.warn{color:var(--warn)}
#embed-host{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
#embed-host iframe{width:100%;height:100%;border:0;display:block}
#embed-host:fullscreen{border-radius:0}
@media (max-width:860px){.emb-bar{flex-wrap:wrap}.emb-chips{flex:1 1 100%}.emb-bar>.row{margin-left:auto}.emb-bar #emb-full{display:none}.emb-note{font-size:11.5px}#embed-host{margin-inline:-16px;border-radius:0;border-inline:0}}
.ys-tbl .inp{min-width:96px;padding:5px 7px;font-size:13px}.ys-tbl td{padding:5px 6px;vertical-align:middle}
.ys-vouchers{display:flex;flex-direction:column;gap:10px}
.ys-v{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.ys-copy{all:unset;cursor:pointer;padding:6px 10px;border-radius:7px;background:var(--sunk);font-size:13.5px;line-height:1.45;overflow-wrap:anywhere}
.ys-copy:hover,.ys-copy:focus-visible{background:var(--accent-soft);outline:1px solid var(--accent)}
@media (max-width:620px){.ys-v{grid-template-columns:1fr}}
.sy-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.sy-dot.saving,.sy-dot.wait{background:var(--warn)}.sy-dot.err,.sy-dot.conflict{background:var(--stamp)}.sy-dot.off{background:var(--line-strong)}
.wl-mark{align-self:flex-start;font-size:10px;font-weight:700;line-height:15px;padding:0 5px;border-radius:4px;background:var(--ok-soft,var(--sunk));color:var(--ok);border:1px solid currentColor}
.wl-box{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-strong)}
.wl-box textarea{line-height:1.7}
.tool-seg{margin-bottom:4px;align-self:flex-start}
.chip.vfy{background:transparent;border:1px dashed var(--warn,#b7791f);color:var(--warn,#b7791f);height:18px;padding:0 6px;font-size:11px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
.tbl th{background:var(--sunk);font-weight:600;color:var(--ink-2);font-size:12px;position:sticky;top:0}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.wrap{white-space:normal;min-width:160px}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:600;background:var(--sunk)}

.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.note{padding:10px 12px;border-radius:8px;background:var(--sunk);color:var(--ink-2);font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note b{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:860px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

.sheet-back{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet .panel-b{display:flex;flex-direction:column;gap:12px}

.sheet-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}

/* ---------- home ---------- */
.today-strip{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:18px 20px}
.datebox{text-align:center;border-right:1px solid var(--line);padding-right:20px}
.datebox .d{font:700 44px/1 var(--f-display);color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi .v{font:600 24px/1.1 var(--f-body);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink-3)}
.kpi.crit .v{color:var(--stamp)} .kpi.warn .v{color:var(--warn)}
@media (max-width:700px){.today-strip{grid-template-columns:1fr}.datebox{border-right:0;border-bottom:1px solid var(--line);padding:0 0 12px;display:flex;align-items:baseline;gap:10px;text-align:left}.kpis{grid-template-columns:repeat(2,1fr)}}

.dl{list-style:none;margin:0;padding:0}
.dl li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.dl li:last-child{border-bottom:0}
.dl .when{font-size:12px;line-height:1.25}
.dl .when b{display:block;font:600 15px/1.2 var(--f-body);font-variant-numeric:tabular-nums}
.dl .t{font-weight:500}
.dl .s{font-size:12px;color:var(--ink-3)}
.dl li.done .t{text-decoration:line-through;color:var(--ink-3)}
.check{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line-strong);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:15px;height:15px}

.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.app{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-decoration:none;color:var(--ink);min-height:112px;position:relative}
a.app:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.app .ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font:700 15px var(--f-display)}
.app .n{font-weight:600}
.app .dsc{font-size:12px;color:var(--ink-3);line-height:1.4}
.app .st{margin-top:auto}
.app .edit{position:absolute;top:8px;right:8px}
.app .edit + .newtab{right:44px;top:8px}

.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{padding:6px 8px;font-size:12px;color:var(--ink-3);font-weight:600;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
.cal .cell{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;background:var(--surface)}
.cal .cell:hover{background:var(--sunk)}
.cal .cell.out{background:var(--ground);color:var(--ink-3)}
.cal .cell .dn{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:4px;align-items:center}
.cal .cell.hol .dn,.cal .cell.sun .dn{color:var(--stamp)}
.cal .cell.sat .dn{color:var(--accent)}
.cal .cell.today .dn span.n{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px}
.cal .cell{position:relative}
.cal .cell.today{background:var(--accent-soft);box-shadow:inset 0 0 0 2.5px var(--accent);z-index:1}
.cal .cell.today::after{content:'오늘';position:absolute;top:5px;right:6px;font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:0 5px;line-height:17px}
.cal .cell.today .ev{background:var(--surface)}
@media (max-width:620px){.cal .cell.today::after{display:none}.cal .cell.today{box-shadow:inset 0 0 0 2px var(--accent)}}
.cal .hn{font-size:10px;color:var(--stamp);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{font-size:11.5px;line-height:1.3;padding:2px 5px;border-radius:4px;background:var(--sunk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--cat-etc)}
.ev.done{opacity:.5;text-decoration:line-through}
.ev.x{background:transparent;border-left-style:dotted;color:var(--ink-2)}
.cal-more{font-size:11px;color:var(--ink-3)}
@media (max-width:700px){
  .cal .cell{min-height:52px;padding:4px}
  .cal .ev{display:none}
  .cal .hn{display:none}
  .cal .pips{display:flex;gap:2px;flex-wrap:wrap}
}
.pips{display:none}
.pips i{width:6px;height:6px;border-radius:50%;display:block}

/* ---------- routines ---------- */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li .tx{padding-top:3px}
.steps li.on .tx{color:var(--ink-3);text-decoration:line-through}
.steps .lnk{margin-left:auto;font-size:12px;white-space:nowrap}

/* ---------- bridge ---------- */
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--ground)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .fn{font-weight:600;word-break:break-all}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.stat{padding:12px;border-radius:8px;background:var(--sunk)}
.stat .v{font:600 20px/1.1 var(--f-body);font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--ink-3)}
.stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)} .stat.crit .v{color:var(--stamp)}
tr.entered td{color:var(--ink-3)}
tr.entered td.t{text-decoration:line-through}
.copyc{cursor:pointer;border-bottom:1px dashed var(--line-strong)}
.copyc:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- documents ---------- */
.doc-layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}

.ho-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:18px;align-items:start}
.ho-layout>*{min-width:0}
@media (max-width:860px){.ho-layout{grid-template-columns:1fr}}
.preview-wrap{background:var(--sunk);border-radius:var(--radius);padding:16px;overflow:auto;border:1px solid var(--line)}
.a4{background:var(--paper);color:var(--paper-ink);width:210mm;min-height:297mm;padding:22mm 20mm;margin:0 auto;box-shadow:var(--shadow);font:14px/1.7 "Noto Serif KR","Hahmlet","Batang",serif;position:relative}
.a4-scale{transform-origin:top left}
.a4 h1{text-align:center;font:700 30px/1.3 "Hahmlet",serif;letter-spacing:.5em;margin:10mm 0 12mm;padding-left:.5em}
.a4 .docno{font:12px var(--f-mono);color:#444}
.a4 table.dt{width:100%;border-collapse:collapse;margin:6mm 0;font-size:14px}

.a4 table.dt th{background:#f1f1f1;width:24%;font-weight:600;text-align:center}
.a4 .cert{text-align:center;margin:16mm 0 6mm;font-size:16px}
.a4 .date{text-align:center;font-size:16px;margin:10mm 0}
.a4 .issuer{text-align:center;font:700 20px/1.6 "Hahmlet",serif;margin-top:12mm;position:relative}
.a4 .seal{display:inline-block;width:18mm;height:18mm;border:2px solid #c0392b;border-radius:3px;color:#c0392b;font:600 11px/1.15 "Hahmlet",serif;vertical-align:middle;margin-left:4mm;padding-top:3mm;text-align:center}
.a4 .appr{float:right;border-collapse:collapse;margin-bottom:6mm}
.a4 .appr td{border:1px solid #333;width:21mm;text-align:center;font-size:12px;padding:3px}
.a4 .appr tr:last-child td{height:15mm}
.a4 .appr td.lab{width:8mm;writing-mode:vertical-rl;letter-spacing:.3em;background:#f1f1f1}
.a4 .body{white-space:pre-wrap}
.a4 .clear{clear:both}
.a4 .amount-big{font:700 18px/1.4 "Hahmlet",serif}

@media print{
  body{background:#fff}
  .shell>.side,.tabbar,.no-print,.toast{display:none!important}

  .doc-layout{display:block}
  .preview-wrap{background:none;border:0;padding:0;overflow:visible}

  @page{size:A4;margin:0}
}
.fl-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line,#e5e5e5)}.fl-row:last-child{border-bottom:0}.fl-main{min-width:0}.fl-name{word-break:break-all}.fl-act{flex-shrink:0}@media(max-width:600px){.fl-row{flex-direction:column;align-items:stretch}}

.cg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.cg-l{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.cg-i{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 4px;border-radius:6px;font:inherit;color:inherit;cursor:pointer}
.cg-i:hover{background:var(--bg-2,rgba(128,128,128,.12))}
.cg-r{display:flex;align-items:center;gap:6px}.cg-r .cg-i{flex:1;min-width:0}.cg-date{font:inherit;font-size:12px;padding:3px 4px;border:1px solid var(--line,#ddd);border-radius:6px;background:transparent;color:inherit;width:128px}.cg-date.und{border-color:var(--stamp)}
.cg-t{font-size:13px}.cg-d{font-size:12px;color:var(--ink-3);white-space:nowrap}.cg-d.und{color:var(--stamp)}
.pl-wrap{display:flex;flex-wrap:wrap;gap:8px}
.pl-i{display:flex;flex-direction:column;gap:2px;padding:6px 10px;border:1px solid var(--line,#ddd);border-left:4px solid;border-radius:8px;text-decoration:none;color:inherit;font-size:13px}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pl-m{border:1px solid var(--line,#ddd);border-radius:10px;padding:8px}.pl-m.now{border-color:var(--accent)}
.pl-h{font-weight:700;margin-bottom:6px}.pl-b{display:flex;flex-direction:column;gap:6px}

<script>window.HUB_ENV='web';</script>
<script>
/* ================= core ================= */
const ENV = window.HUB_ENV || 'web';           // 'artifact' | 'web'
const CAN_FILE = ENV !== 'artifact';            // print & download only outside the artifact frame
const KEY = 'il-hub-v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const won = n => (Math.round(Number(n)||0)).toLocaleString('ko-KR');
const DOW = ['일','월','화','수','목','금','토'];
const clone = o => JSON.parse(JSON.stringify(o));

const ICON = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  cal:'<rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/>',
  bridge:'<path d="M4 7h10l-3-3M20 17H10l3 3"/><rect x="2.5" y="10" width="7" height="4" rx="1"/><rect x="14.5" y="10" width="7" height="4" rx="1"/>',
  doc:'<path d="M6 2.5h8l5 5V21a.5.5 0 0 1-.5.5h-12A.5.5 0 0 1 6 21z"/><path d="M14 2.5v5h5M9 12h7M9 16h7"/>',
  apps:'<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  hand:'<path d="M4 7h9a3 3 0 0 1 0 6H9"/><path d="m7 10-3-3 3-3"/><path d="M20 17h-9a3 3 0 0 1 0-6"/><path d="m17 20 3-3-3-3"/>',
  won:'<path d="M4 7l3 11 5-11 5 11 3-11M3 11h18M3 14h18"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  left:'<path d="m15 5-7 7 7 7"/>', right:'<path d="m9 5 7 7-7 7"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  down:'<path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/>',
  print:'<path d="M7 9V3h10v6M7 17H4v-7a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v7h-3"/><rect x="7" y="14" width="10" height="7"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
};
const icon = (k, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

/* ---------- storage ---------- */
let S;
function load() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  const def = defaults();
  if (!saved) return def;
  // merge shallowly so new default keys appear after updates
  for (const k of Object.keys(def)) if (saved[k] === undefined) saved[k] = def[k];
  saved.settings = Object.assign({}, def.settings, saved.settings);
  saved.settings.org = Object.assign({}, def.settings.org, saved.settings.org);
  if ((saved.v || 1) < 2) { // v2: 실제 저장소 목록으로 앱 교체, 직접 추가한 앱은 유지
    const mine = (saved.apps || []).filter(a => !/^a\d$/.test(a.id));
    saved.apps = [...def.apps, ...mine]; saved.v = 2;
  }
  if (saved.v < 3) { // v3: 확인된 실제 주소 반영 (기본 앱만 갱신, 직접 추가한 앱 유지)
    const byId = Object.fromEntries(def.apps.map(a => [a.id, a]));
    saved.apps = saved.apps.map(a => byId[a.id] ? {...a, url: byId[a.id].url || a.url, st: byId[a.id].st, desc: byId[a.id].desc} : a);
    saved.v = 3;
  }
  if (saved.v < 4) { // v4: 인수인계 문서에서 나온 마감 추가, 급여 루틴을 실제 절차로
    const have = new Set(saved.rules.map(r => r.id));
    saved.rules.push(...def.rules.filter(r => !have.has(r.id)));
    const rt2 = saved.routines.find(r => r.id === 'rt2'), d2 = def.routines.find(r => r.id === 'rt2');
    if (rt2 && rt2.steps.length === 6 && rt2.steps[0].t === '근태·연차·입퇴사 변동 반영') rt2.steps = d2.steps;
    saved.v = 4;
  }
  if (saved.v < 5) { const have = new Set(saved.rules.map(r => r.id)); saved.rules.push(...def.rules.filter(r => !have.has(r.id))); saved.v = 5; }
  if (saved.v < 6) {
    const have = new Set(saved.rules.map(r => r.id)); saved.rules.push(...def.rules.filter(r => !have.has(r.id)));
    const map = {rt1:'monthclose', rt2:'pay', rt3:'monthclose', rt4:'budget', rt5:'budget'};
    saved.rules.forEach(r => { if (r.routine && !r.sop) r.sop = map[r.routine] || ''; if (r.id === 'y1' && r.routine === 'rt4') r.sop = 'yearend'; delete r.routine; if (VERIFY_IDS.includes(r.id) && !r.verified) r.verify = true; });
    // 직접 만든 루틴은 "내 절차"로 옮김
    const own = (saved.routines || []).filter(r => !map[r.id] && r.steps && r.steps.length);
    saved.hoCustom = saved.hoCustom || [];
    own.forEach(r => saved.hoCustom.push({id:'c' + r.id, cat:'gen', freq: HO_FREQ[r.freq] ? r.freq : 'adhoc', title:r.name, when:r.when || '', sections:[{h:'단계', steps:r.steps.map(x => x.t), warn:[]}]}));
    saved.v = 6;
  }
  if (saved.v < 7) { // v7: 정기·만기 일정(보험·구독·의무교육·회의·점검) 추가, 업무분장 앱 기준 날짜 정렬
    const have = new Set(saved.rules.map(r => r.id)); saved.rules.push(...def.rules.filter(r => !have.has(r.id)));

/* ===== 절차 목록 (기본 + 화면에서 고친 것 + 직접 만든 것) ===== */
function sops() {
  const ed = S.hoEdit || {}, custom = S.hoCustom || [];
  return [...HO_SOPS.map(s => ed[s.id] ? Object.assign({}, s, ed[s.id], {edited:true}) : s), ...custom.map(s => Object.assign({custom:true, systems:[], paths:[], rules:[]}, s))];
}
function sopById(id) { return sops().find(s => s.id === id); }
function sopOfRule(rule) { return rule.sop ? sopById(rule.sop) : sops().find(s => (s.rules || []).includes(rule.id)); }
// 절차 ↔ 편집용 글 형식
function sopToText(s) { return s.sections.map(sec => `## ${sec.h}\n` + sec.steps.map(t => `- ${t}`).join('\n') + (sec.warn || []).map(w => `\n! ${w}`).join('')).join('\n\n'); }
function textToSections(txt) {
  const out = []; let cur = null;
  txt.split('\n').forEach(l => { const t = l.trim(); if (!t) return;
    if (t.startsWith('##')) { cur = {h: t.replace(/^#+\s*/, ''), steps: [], warn: []}; out.push(cur); return; }
    if (!cur) { cur = {h: '절차', steps: [], warn: []}; out.push(cur); }
    if (t.startsWith('!')) cur.warn.push(t.replace(/^!\s*/, '')); else cur.steps.push(t.replace(/^[-·•*]\s*/, '')); });
  return out.filter(s => s.steps.length || s.warn.length);
}

/* ---------- schedule expansion ---------- */
const isHoliday = d => { const k = ymd(d); return !!S.holidays[k]; };
const isOff = d => d.getDay() === 0 || d.getDay() === 6 || isHoliday(d);
function shiftDay(d, how) {
  if (how === 'none') return d;
  let x = new Date(d), step = how === 'prev' ? -1 : 1, guard = 0;
  while (isOff(x) && guard++ < 14) x = addDays(x, step);
  return x;
}
function ruleDay(rule, y, m) { // m: 0-based
  const last = new Date(y, m+1, 0).getDate();
  let day = rule.day === 'payday' ? Number(S.settings.payday) : rule.day === 'last' ? last : Number(rule.day);
  return new Date(y, m, Math.min(day, last));
}
// returns [{rule, date(Date), orig(Date), key}]
function occurrences(from, to) {
  const out = [];
  for (const r of S.rules) {
    if (r.off || r.undated) continue;
    if (r.type === 'once') {
      const d = parseYmd(r.date);
      if (d >= from && d <= to) out.push(mk(r, d, d));
      continue;
    }
    let y = from.getFullYear(), m = from.getMonth() - 1; // start 1 month earlier to catch shifted dates
    const endY = to.getFullYear(), endM = to.getMonth() + 1;
    while (y < endY || (y === endY && m <= endM)) {
      const yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12;
      if (r.type === 'monthly' || (r.type === 'yearly' && (Array.isArray(r.month) ? r.month.map(Number).includes(mm + 1) : Number(r.month) - 1 === mm))) {
        const orig = ruleDay(r, yy, mm), d = shiftDay(orig, r.shift);
        if (d >= from && d <= to) out.push(mk(r, d, orig));
      }
      m++; if (m >= 12) { m -= 12; y++; }
    }
  }
  return out.sort((a, b) => a.date - b.date || a.rule.title.localeCompare(b.rule.title));
  function mk(rule, date, orig) { const key = rule.id + '@' + ymd(orig); return {rule, date, orig, key, done: !!S.done[key]}; }
}
function overdueList() {
  const t = today(), since = S.settings.since ? parseYmd(S.settings.since) : addDays(t, -45);
  const from = since > addDays(t, -45) ? since : addDays(t, -45);
  return occurrences(from, addDays(t, -1)).filter(o => !o.done);
}
function overdueCount() { try { return overdueList().length; } catch (e) { return 0; } }
function dday(d) {
  const n = Math.round((d - today()) / 864e5);
  return n === 0 ? '오늘' : n > 0 ? `D-${n}` : `D+${-n}`;
}
function toggleDone(key) { if (S.done[key]) delete S.done[key]; else S.done[key] = Date.now(); save(); }

/* ---------- routine periods ---------- */
function periodKey(rt, d = today()) {
  if (rt.freq === 'monthly') return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  if (rt.freq === 'yearly') { const s = d.getMonth() >= 9 ? d.getFullYear() : d.getFullYear() - 1; return `${s}년 말~${s+1}년 초`; } // 10월에 새 사이클 시작
  return S.checks[rt.id + ':adhoc-cur'] || '1차';
}
function routineState(rt, period = periodKey(rt)) {
  const arr = S.checks[rt.id + '@' + period] || [];
  const done = rt.steps.filter((_, i) => arr[i]).length;
  return {period, arr, done, total: rt.steps.length};
}

function lsRead(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
async function getText(urls) {
  for (const u of urls) { try { const r = await fetch(u, {cache:'no-store'}); if (r.ok) return {text: await r.text(), url: u}; } catch (e) {} }
  return null;
}
async function loadConnectors() {
  const sameOrigin = location.hostname === `${GH.owner}.github.io`;

  }
  if (!hd && S.imports?.huga) { hd = S.imports.huga; H.src = '가져온 파일'; }
  H.data = hd; H.status = hd ? 'ok' : 'none';

  const Bd = CONN.birth; Bd.status = 'loading';
  let bd = lsRead('guro_birthdays'); if (Array.isArray(bd) && bd.length) Bd.src = '생일 앱 (이 브라우저)'; else bd = null;
  if (!bd && ENV !== 'artifact') {

    const m = t && t.text.match(/INITIAL_DATA\s*=\s*(\[[\s\S]*?\]);/);

  }
  if (!bd && S.imports?.birth) { bd = S.imports.birth; Bd.src = '가져온 파일'; }
  Bd.data = bd; Bd.status = bd ? 'ok' : 'none';
}

/* ---------- 휴가 계산 (guro_huga의 leaveDelta와 동일 규칙) ---------- */
function leaveDelta(type) { if (type === '반차') return 0.5; if (type === '반반차') return 0.25; if (['교육','출장','개인일정'].includes(type)) return 0; return 1; }
function hugaEmp(id) { return (CONN.huga.data?.employees || []).find(e => e.id === id); }
function leaveEvents(from, to) {
  const d = CONN.huga.data; if (!d) return [];
  const a = ymd(from), b = ymd(to);
  return (d.records || []).filter(r => r.date >= a && r.date <= b).map(r => ({kind:'leave', date: parseYmd(r.date), title: `${hugaEmp(r.empId)?.name || '직원'} ${r.type}`, rec: r}));
}
function leaveBalance() {
  const d = CONN.huga.data; if (!d) return [];
  const y = today().getFullYear();
  return (d.employees || []).filter(e => !e.resignationDate).map(e => {
    const used = (d.records || []).filter(r => r.empId === e.id && r.date.startsWith(String(y))).reduce((s, r) => s + leaveDelta(r.type), 0);
    const grant = (d.subLeaves || []).filter(s => s.empId === e.id && s.type === 'grant' && s.date.startsWith(String(y))).reduce((s, x) => s + Number(x.days || 0), 0);
    const total = d.totals?.[`${e.id}_${y}`];
    return {name: e.name, dept: e.dept, used: Math.round(used * 100) / 100, total: total == null || total === '' ? null : Number(total) + grant, left: total == null || total === '' ? null : Math.round((Number(total) + grant - used) * 100) / 100};
  });
}
/* ---------- 생일 ---------- */
function birthdayEvents(from, to) {
  const list = CONN.birth.data; if (!list) return [];
  const out = [];
  for (let y = from.getFullYear(); y <= to.getFullYear(); y++)
    list.forEach(p => { const d = new Date(y, Number(p.m) - 1, Number(p.d)); if (d >= from && d <= to) out.push({kind:'bday', date:d, title:`${p.name} 생일`, p}); });
  return out.sort((a, b) => a.date - b.date);
}
function extraEvents(from, to) { return [...leaveEvents(from, to), ...birthdayEvents(from, to)]; }

/* ================= calendar ================= */
let calMonth = (() => { const t = today(); return new Date(t.getFullYear(), t.getMonth(), 1); })();
let calFilter = new Set([...Object.keys(CATS), 'leave', 'bday']);
const calMineOn = () => S.calMine !== false;
const calShow = o => calFilter.has(o.rule.cat) && !(calMineOn() && o.rule.who === 'other');
const WHO = {me:'내 담당', shared:'공통', other:'다른 담당'};
const CAL_GROUPS = ['sub','edu','insp','mtg'];
// 분류별 모아보기: 다음 일정 날짜(또는 날짜 미정)
function calGroupPanel() {
  const t = today(), to = addDays(t, 366), occ = occurrences(t, to);
  const vis = r => !r.off && !(calMineOn() && r.who === 'other');
  const col = CAL_GROUPS.map(cat => {
    const rules = S.rules.filter(r => r.cat === cat && vis(r));
    const rows = rules.map(r => { const o = occ.find(x => x.rule.id === r.id); return {r, o}; })
      .sort((a, b) => (a.r.undated ? 1 : 0) - (b.r.undated ? 1 : 0) || ((a.o ? a.o.date : addDays(t, 999)) - (b.o ? b.o.date : addDays(t, 999))));
    return `<div class="cg"><div class="row" style="gap:6px"><span class="dotcat" style="background:${CATS[cat].color}"></span><b>${CATS[cat].name}</b><span class="faint small">${rules.length}건</span></div>
      <ul class="cg-l">${rows.map(({r, o}) => `<li class="cg-r"><button class="cg-i" data-edit-rule="${r.id}" title="전체 편집"><span class="cg-t">${esc(r.title)}</span>${r.undated || !o ? '' : `<span class="cg-d">D${(() => { const d = Math.round((o.date - t) / 864e5); return d === 0 ? '-day' : d > 0 ? '-' + d : '+' + (-d); })()}</span>`}</button><input type="date" class="cg-date ${r.undated ? 'und' : ''}" data-cgdate="${r.id}" value="${r.undated || !o ? '' : ymd(o.date)}" aria-label="${esc(r.title)} 날짜"></li>`).join('') || '<li class="faint small">없음</li>'}</ul></div>`;
  }).join('');
  const und = S.rules.filter(r => r.undated && !r.off && vis(r)).length;
  return `<section class="panel"><div class="panel-h"><h2>정기·만기 모아보기</h2><span class="faint small">${und ? `날짜 미정 ${und}건 — 눌러서 날짜를 입력하면 캘린더에 올라가요` : '보험·구독 만기, 교육, 점검·평가·감사, 회의·임기'}</span></div><div class="panel-b cg-grid">${col}</div></section>`;
}

function toYmd(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return ymd(new Date(v.getFullYear(), v.getMonth(), v.getDate(), 12));
  if (typeof v === 'number') {
    if (v > 19000000 && v < 21000000) { const s = String(v); return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`; }
    if (v > 20000 && v < 80000 && window.XLSX) { const p = XLSX.SSF.parse_date_code(v); return `${p.y}-${pad(p.m)}-${pad(p.d)}`; }
    return null;
  }
  const s = String(v).trim();
  let m = s.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function toNum(v) {
  if (typeof v === 'number') return v;
  if (v == null) return 0;
  let s = String(v).replace(/[,\s원₩]/g, '');
  if (!s || s === '-') return 0;
  let neg = /^\(.*\)$/.test(s) || /^△|^▲/.test(s); s = s.replace(/[()△▲]/g, '');
  const n = parseFloat(s); return isNaN(n) ? 0 : (neg ? -Math.abs(n) : n);
}
function detectHeader(rows) {
  const all = Object.values(FIELD).map(f => f.re);
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const cells = rows[i].filter(c => typeof c === 'string' && c.trim());
    if (cells.length >= 3 && cells.some(c => all.some(re => re.test(c)))) return i;
  }
  return Math.max(0, rows.findIndex(r => r.some(c => c !== '')));
}
function autoMap(headers, fields) {
  const m = {}, used = new Set();
  for (const f of fields) {
    const re = FIELD[f].re;
    let idx = headers.findIndex((h, i) => !used.has(i) && re.test(String(h)));
    if (f === 'group' && idx < 0) idx = headers.findIndex((h, i) => !used.has(i) && FIELD.acct.re.test(String(h)));
    if (idx >= 0) { m[f] = idx; used.add(idx); }
  }
  // 차변이 금액으로 잡혔으면 대변을 amt2로
  return m;
}
function readWorkbook(file) {
  return new Promise((res, rej) => {
    if (!window.XLSX) return rej(new Error('엑셀 모듈을 불러오지 못했어요. 인터넷 연결을 확인해 주세요'));
    const fr = new FileReader();
    fr.onload = () => { try { res(XLSX.read(new Uint8Array(fr.result), {type:'array', cellDates:true})); } catch (e) { rej(e); } };
    fr.onerror = () => rej(fr.error); fr.readAsArrayBuffer(file);
  });
}
function setSheet(slot, wb, name) {
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});
  const f = B.files[slot]; f.sheet = name; f.rows = rows; f.hdr = detectHeader(rows);
  B.map[slot] = autoMap(rows[f.hdr] || [], MODES[B.mode].fields);
  if (recallMap(slot)) toast('지난번에 지정한 열 설정을 불러왔어요');
}
function items(slot) {
  const f = B.files[slot], mp = B.map[slot] || {}; if (!f) return [];
  const out = [];
  f.rows.slice(f.hdr + 1).forEach((r, i) => {
    const get = k => mp[k] != null ? r[mp[k]] : '';
    const date = toYmd(get('date')); if (!date) return;
    const desc = String(get('desc') ?? '').trim();
    if (SKIP_RE.test(desc) || SKIP_RE.test(String(get('acct')))) return;
    const a1 = toNum(get('amt')), a2 = mp.amt2 != null ? toNum(get('amt2')) : 0;
    const amt = a1 || a2; if (!amt) return;
    out.push({i, date, amt, abs: Math.abs(amt), side: a1 ? 'a' : 'b', desc, acct: String(get('acct') ?? '').trim(), group: String(get('group') ?? '').trim() || '(미지정)',
      kind: String(get('kind') ?? '').trim(), party: String(get('party') ?? '').trim(), fund: String(get('fund') ?? '').trim()});
  });
  return out;
}

/* ---------- reconciliation ---------- */
function reconcile() {
  let A = items('jinwoo'), Bm = items('manual');
  const months = [...new Set([...A, ...Bm].map(x => x.date.slice(0, 7)))].sort();
  if (!B.period || !months.includes(B.period)) {
    const cnt = {}; A.forEach(x => cnt[x.date.slice(0,7)] = (cnt[x.date.slice(0,7)]||0) + 1);
    B.period = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0] || months[months.length-1] || '';
  }
  if (B.period !== 'all') { A = A.filter(x => x.date.startsWith(B.period)); Bm = Bm.filter(x => x.date.startsWith(B.period)); }
  const usedB = new Set(), matched = [], near = [], diff = [];
  const idx = {}; Bm.forEach((b, i) => (idx[b.date + '|' + b.abs] ||= []).push(i));
  const restA = [];
  A.forEach(a => { const l = idx[a.date + '|' + a.abs]; const bi = l && l.find(i => !usedB.has(i)); if (bi != null) { usedB.add(bi); matched.push({a, b: Bm[bi]}); } else restA.push(a); });
  const restA2 = [];
  restA.forEach(a => {
    let best = -1, bd = 99;
    Bm.forEach((b, i) => { if (usedB.has(i) || b.abs !== a.abs) return; const dd = Math.abs((parseYmd(a.date) - parseYmd(b.date)) / 864e5); if (dd <= 3 && dd < bd) { bd = dd; best = i; } });
    if (best >= 0) { usedB.add(best); near.push({a, b: Bm[best], gap: bd}); } else restA2.push(a);
  });
  // 같은 날짜, 금액만 다른 건 (금액 불일치)
  const onlyA = [];
  restA2.forEach(a => {
    const bi = Bm.findIndex((b, i) => !usedB.has(i) && b.date === a.date);
    if (bi >= 0 && restA2.filter(x => x.date === a.date).length === 1 && Bm.filter((b, i) => !usedB.has(i) && b.date === a.date).length === 1) { usedB.add(bi); diff.push({a, b: Bm[bi], d: Bm[bi].abs - a.abs}); }
    else onlyA.push(a);
  });
  const onlyB = Bm.filter((_, i) => !usedB.has(i));
  const sum = l => l.reduce((s, x) => s + x.abs, 0);
  return {months, matched, near, diff, onlyA, onlyB, sumA: sum(A), sumB: sum(Bm), nA: A.length, nB: Bm.length};
}

function pasteStaff() {
  sheet({title:'엑셀에서 직원 붙여넣기', wide:true, body:`<div class="note">엑셀에서 제목 줄까지 포함해 범위를 복사한 뒤 아래에 붙여 넣으세요. <b>성명, 생년월일, 소속(부서), 직위, 입사일, 퇴사일, 담당업무</b> 열을 이름으로 알아봅니다.</div>
    <textarea class="inp mono" id="sp-t" rows="9" placeholder="성명&#9;생년월일&#9;부서&#9;직위&#9;입사일"></textarea><div id="sp-r" class="small faint"></div>`,
    foot:`<button class="btn" data-close>취소</button><button class="btn primary" id="sp-go">추가하기</button>`,
    onMount: el => {
      const parse = () => {
        const lines = $('#sp-t', el).value.split(/\r?\n/).filter(l => l.trim()).map(l => l.split('\t'));
        if (lines.length < 2) return [];
        const h = lines[0].map(x => x.trim()), col = re => h.findIndex(x => re.test(x));
        const c = {name:col(/성명|이름/), birth:col(/생년|생일/), dept:col(/소속|부서|팀/), pos:col(/직위|직급|직책/), hired:col(/입사|채용/), left:col(/퇴사|퇴직/), duty:col(/업무|담당/)};
        if (c.name < 0) return [];
        return lines.slice(1).map(r => { const o = {id: uid()}; for (const k in c) { const v = c[k] >= 0 ? (r[c[k]] || '').trim() : ''; o[k] = /birth|hired|left/.test(k) ? (toYmd(v) || '') : v; } return o; }).filter(o => o.name);
      };
      $('#sp-t', el).oninput = () => { const p = parse(); $('#sp-r', el).textContent = p.length ? `${p.length}명 인식: ${p.slice(0,5).map(x=>x.name).join(', ')}${p.length>5?' …':''}` : '제목 줄에 "성명"이 있어야 해요'; };
      $('#sp-go', el).onclick = () => { const p = parse(); if (!p.length) { toast('인식된 직원이 없어요'); return; } S.staff.push(...p); save(); closeSheet(); render(); toast(`${p.length}명을 추가했어요`); };
    }});
}

function worklogAuto(date) {
  const d = date ? parseYmd(date) : today(), k = ymd(d), out = [];
  const daily = sops().filter(s => s.freq === 'daily' && s.id !== 'worklog');
  daily.forEach(s => { const arr = (S.ho?.checks || {})[s.id + '@' + k] || {}; if (Object.values(arr).some(Boolean)) out.push(s.id === 'daily' ? '자금일보 작성 및 일일 자금 집행내역 확인' : s.title); });
  occurrences(addDays(d, -7), d).filter(o => o.done && ymd(new Date(S.done[o.key])) === k).forEach(o => out.push(o.rule.title));
  ((S.ho?.log || {})[k] || []).filter(t => !daily.some(x => x.title === t)).forEach(t => out.push(t + ' 업무 처리'));
  (S.settings.worklogBase || WORKLOG_BASE).forEach(t => out.push(t));
  return [...new Set(out)].join('\n');
}

/* ---------- 업무일지 기록 (캘린더·문서 공용, 날짜별 저장 → 자동 연동에도 포함) ---------- */
function wlogGet(date) { return ((S.wlog || {})[date] || {}).content || ''; }
function wlogSet(date, content, note) { if (!date) return; S.wlog = S.wlog || {}; if (!String(content || '').trim() && !String(note || '').trim()) delete S.wlog[date]; else S.wlog[date] = {content: content || '', note: note || '', at: new Date().toISOString()}; save(); }
/* hwpx 업무일지 "업무내용" 칸에 붙여 넣기 좋은 모양: 한 줄에 하나, 앞에 · */
function wlogHwpText(content) { return String(content || '').split('\n').map(s => s.trim().replace(/^[-·•]\s*/, '')).filter(Boolean).map(s => '· ' + s).join('\n'); }
function wlogMonthText(y, m) {
  const out = []; for (let d = new Date(y, m, 1); d.getMonth() === m; d = addDays(d, 1)) { const k = ymd(d), c = wlogGet(k); if (c) out.push(`[${d.getMonth() + 1}/${d.getDate()} ${DOW[d.getDay()]}]\n${wlogHwpText(c)}`); }
  return out.join('\n\n');
}

/* ================= 단계별 사진 (이 기기 IndexedDB에만 저장) ================= */
const PH = {db: null, map: {}, ready: false, count: 0};
const phKey = (sop, k) => sop + '|' + k;
function phOpen() {
  return new Promise(res => {
    try {
      const rq = indexedDB.open('il-hub-photos', 1);
      rq.onupgradeneeded = () => { const s = rq.result.createObjectStore('p', {keyPath: 'id'}); s.createIndex('key', 'key'); };
      rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
function phTx(mode, fn) {
  return new Promise(res => {
    if (!PH.db) { res(null); return; }
    try { const tx = PH.db.transaction('p', mode), st = tx.objectStore('p'); const r = fn(st); tx.oncomplete = () => res(r && r.result !== undefined ? r.result : true); tx.onerror = () => res(null); }
    catch (e) { res(null); }
  });
}
async function loadPhotos() {
  PH.db = PH.db || await phOpen();
  const all = (await phTx('readonly', st => st.getAll())) || [];
  PH.map = {}; all.sort((a, b) => (a.ord || 0) - (b.ord || 0)).forEach(p => (PH.map[p.key] ||= []).push(p));
  PH.count = all.length; PH.ready = true;
}
function photosOf(sop, k) { return PH.map[phKey(sop, k)] || []; }
function photosOfSop(sop) { return Object.entries(PH.map).filter(([key]) => key.startsWith(sop + '|')).reduce((a, [, v]) => a + v.length, 0); }
async function photoAdd(sop, k, data, cap = '', src = '직접 추가') {
  const p = {id: uid() + Date.now().toString(36), key: phKey(sop, k), sop, k, data, cap, src, ord: Date.now()};
  if (!PH.db) { (PH.map[p.key] ||= []).push(p); PH.count++; toast('이 브라우저는 사진 저장이 막혀 있어요. 새로고침하면 사라져요'); return p; }
  await phTx('readwrite', st => st.put(p)); await loadPhotos(); phChanged(); return p;
}
async function photoUpdate(p) { p.synced = false; await phTx('readwrite', st => st.put(p)); await loadPhotos(); phChanged(); }
async function photoDel(id) { phTomb([id]); await phTx('readwrite', st => st.delete(id)); await loadPhotos(); phChanged(); }
async function photoClear() { phTomb(Object.values(PH.map).flat().map(p => p.id)); await phTx('readwrite', st => st.clear()); await loadPhotos(); phChanged(); }
/* 연동 훅 (sync.js가 있으면 클라우드로 보냄) */
function phChanged() { if (typeof syncPhotosSoon === 'function') syncPhotosSoon(); }
function phTomb(ids) { try { const t = JSON.parse(localStorage.getItem('il-hub-ph-del') || '[]'); localStorage.setItem('il-hub-ph-del', JSON.stringify([...new Set([...t, ...ids])])); } catch (e) {} }

/* 큰 사진은 줄여서 저장 (긴 변 1600px, JPEG) */
function shrinkImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const m = 1600, r = Math.min(1, m / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.84)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* 사진 팩: {type:'il-hub-photos', items:[{sop,k,cap,src,data}]} */
async function importPack(txt) {
  let d; try { d = typeof txt === 'string' ? JSON.parse(txt) : txt; } catch (e) { toast('사진 팩 형식이 아니에요'); return 0; }
  if (!d || d.type !== 'il-hub-photos' || !Array.isArray(d.items)) { toast('사진 팩 형식이 아니에요'); return 0; }
  if (!PH.db) { toast('이 브라우저는 사진 저장이 막혀 있어요 (GitHub 배포본에서 해 주세요)'); return 0; }
  const have = new Set(Object.values(PH.map).flat().map(p => p.key + '#' + p.data.length + '#' + p.data.slice(-40)));
  let n = 0, ord = Date.now();
  await phTx('readwrite', st => { d.items.forEach(it => { if (!it.sop || it.k == null || !/^data:image\//.test(it.data || '')) return;
    const key = phKey(it.sop, it.k); if (have.has(key + '#' + it.data.length + '#' + it.data.slice(-40))) return;
    st.put({id: uid() + (ord++).toString(36), key, sop: it.sop, k: String(it.k), data: it.data, cap: it.cap || '', src: it.src || '사진 팩', ord}); n++; }); });
  await loadPhotos(); if (n) phChanged(); return n;
}
function exportPack() {
  const items = Object.values(PH.map).flat().map(({sop, k, cap, src, data}) => ({sop, k, cap, src, data}));
  return JSON.stringify({type: 'il-hub-photos', v: 1, made: ymd(today()), note: '업무 단계 사진. 공개 저장소에 올리지 마세요.', items});
}
function pickPackFile(after) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json'; inp.hidden = true; document.body.appendChild(inp);
  inp.onchange = () => { const f = inp.files[0]; inp.remove(); if (!f) return; const r = new FileReader();
    r.onload = async () => { const n = await importPack(r.result); if (n || n === 0) { toast(n ? `사진 ${n}장을 넣었어요` : '새로 넣을 사진이 없어요 (이미 들어 있음)'); after && after(); } };
    r.readAsText(f); };

/* 크게 보기 */
function lightbox(list, i = 0) {
  const L = document.createElement('div'); L.className = 'lb'; L.setAttribute('role', 'dialog'); L.setAttribute('aria-modal', 'true');
  const draw = () => { const p = list[i];
    L.innerHTML = `<div class="lb-bar"><span class="small">${list.length > 1 ? `${i + 1}/${list.length} · ` : ''}${esc(p.cap || '')}</span><span class="grow"></span><span class="faint small">누르면 확대</span><button class="btn sm" data-x>닫기</button></div>
      <div class="lb-body"><img src="${p.data}" alt="${esc(p.cap || '단계 사진')}"></div>
      ${list.length > 1 ? `<button class="lb-nav l" data-p aria-label="이전 사진">${icon('left')}</button><button class="lb-nav r" data-n aria-label="다음 사진">${icon('right')}</button>` : ''}`; };
  const close = () => { L.remove(); document.removeEventListener('keydown', key, true); };
  const key = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } else if (e.key === 'ArrowRight' && list.length > 1) { i = (i + 1) % list.length; draw(); } else if (e.key === 'ArrowLeft' && list.length > 1) { i = (i - 1 + list.length) % list.length; draw(); } };
  L.addEventListener('click', e => {
    if (e.target.closest('[data-x]') || e.target === L) return close();
    if (e.target.closest('[data-n]')) { i = (i + 1) % list.length; return draw(); }
    if (e.target.closest('[data-p]')) { i = (i - 1 + list.length) % list.length; return draw(); }
    if (e.target.tagName === 'IMG') L.classList.toggle('zoom');
  });
  document.addEventListener('keydown', key, true); draw(); document.body.appendChild(L);
}

/* 단계 사진 관리 시트 */

    <div class="note small">사진은 <b>이 기기 브라우저에만</b> 저장되고 GitHub(공개 사이트)에는 올라가지 않아요. 계좌번호·주민번호가 보이는 화면은 가리고 찍어 주세요.</div>`,

      });

    }});
}

/* 단계 문장에 나오는 파일 위치 찾기 (경로 이름의 핵심 단어로) */
function stepPathHits(s, text) {
  const generic = ['엑셀', '파일', '폴더', '서식', '자료', '위치'];
  return (s.paths || []).filter(([l]) => { const w = l.replace(/\(.*?\)/g, '').split(/[\s·]+/).filter(x => x.length >= 2 && !generic.includes(x));
    if (!w.length) return false; const best = w.reduce((a, b) => b.length >= a.length ? b : a); return text.includes(best); });
}

/* 한 단계씩 실행 모드 */
function runMode(s, start = 0) {
  const st = hoState(), steps = s.sections.flatMap((sec, si) => sec.steps.map((t, i) => ({t, k: `${si}.${i}`, sec, si})));
  if (!steps.length) return;
  const r0 = hoRun(s); let i = start || Math.max(0, steps.findIndex(x => !r0.arr[x.k])); if (i < 0) i = 0;
  const L = document.createElement('div'); L.className = 'run'; L.setAttribute('role', 'dialog'); L.setAttribute('aria-modal', 'true'); L.setAttribute('aria-label', s.title + ' 실행');
  const done = () => hoRun(s).arr;
  const draw = () => {
    const x = steps[i], arr = done(), n = steps.filter(y => arr[y.k]).length, ph = photosOf(s.id, x.k), hits = stepPathHits(s, x.t), on = !!arr[x.k];
    L.innerHTML = `
      <div class="run-top"><div style="min-width:0"><div class="faint small">${esc(s.title)} · ${esc(hoPeriod(s))}</div><b>${esc(x.sec.h)}</b></div><span class="grow"></span><span class="num small">${n}/${steps.length}</span><button class="btn sm" data-x>닫기</button></div>
      <div class="prog" style="margin:0 16px"><i style="width:${n / steps.length * 100}%"></i></div>
      <div class="run-body">
        <div class="run-no">단계 ${i + 1} / ${steps.length}${on ? ' · <span class="chip ok">완료</span>' : ''}</div>
        <div class="run-tx">${esc(x.t)}</div>
        ${hits.length ? `<div class="row" style="gap:6px">${hits.map(([l, p]) => `<button class="chip acc" data-cp="${esc(fullPath(p))}" title="${esc(fullPath(p))}" style="cursor:pointer;border:0">${icon('copy')}${esc(l)} 경로 복사</button>`).join('')}</div>` : ''}
        ${ph.length ? `<div class="run-ph">${ph.map((p, j) => `<figure><img src="${p.data}" data-view="${j}" alt="${esc(p.cap || '')}">${p.cap ? `<figcaption class="small muted">${esc(p.cap)}</figcaption>` : ''}</figure>`).join('')}</div>` : `<button class="btn ghost sm" data-addph style="align-self:flex-start">${icon('plus')}이 단계 사진 추가</button>`}
        ${x.si !== (steps[i - 1] || {}).si || i === 0 ? (x.sec.warn || []).map(w => `<div class="note warn small">주의 · ${esc(w)}</div>`).join('') : (x.sec.warn || []).length ? `<div class="faint small">이 묶음 주의사항 ${x.sec.warn.length}개 (첫 단계에 표시)</div>` : ''}
      </div>
      <div class="run-foot"><button class="btn" data-prev ${i ? '' : 'disabled'}>${icon('left')}이전</button><span class="grow"></span>
        <button class="btn" data-skip>${i < steps.length - 1 ? '건너뛰기' : '끝'}</button>
        <button class="btn primary" data-ok>${on ? '완료 취소' : (i < steps.length - 1 ? '완료 → 다음' : '완료')}</button></div>`;
  };
  const close = () => { L.remove(); document.removeEventListener('keydown', key, true); render(); };
  const toggle = () => { const x = steps[i]; const arr = st.checks[r0.key] = Object.assign({}, st.checks[r0.key]); arr[x.k] = !arr[x.k];
    if (arr[x.k]) { st.log = st.log || {}; const d = ymd(today()); st.log[d] = [...new Set([...(st.log[d] || []), s.title])]; } save(); return arr[x.k]; };
  const next = () => { if (i < steps.length - 1) { i++; draw(); L.querySelector('.run-body').scrollTop = 0; } else { toast(`${s.title} ${Object.values(done()).filter(Boolean).length}/${steps.length} 단계`); close(); } };
  const key = e => { if (document.querySelector('.lb') || $('#layer').innerHTML) return; if (e.key === 'Escape') { e.stopPropagation(); close(); }
    else if (e.key === 'ArrowRight') { i < steps.length - 1 && (i++, draw()); } else if (e.key === 'ArrowLeft') { i > 0 && (i--, draw()); }
    else if (e.key === 'Enter' && !e.target.closest('input,textarea,button')) { e.preventDefault(); toggle() ? next() : draw(); } };
  L.addEventListener('click', e => {
    if (e.target.closest('[data-x]')) return close();
    if (e.target.closest('[data-prev]')) { if (i) { i--; draw(); } return; }
    if (e.target.closest('[data-skip]')) return next();
    if (e.target.closest('[data-ok]')) { toggle() ? next() : draw(); return; }
    const v = e.target.closest('[data-view]'); if (v) return lightbox(photosOf(s.id, steps[i].k), Number(v.dataset.view));
    const cp = e.target.closest('[data-cp]'); if (cp) return copyText(cp.dataset.cp, '경로를 복사했어요');
    if (e.target.closest('[data-addph]')) stepPhotos(s, steps[i].k, steps[i].t, () => draw());
  });
  document.addEventListener('keydown', key, true); draw(); document.body.appendChild(L);
}

/* ================= 자료함 (컴퓨터 폴더에 카테고리별로 정리) =================
   - 파일 본체는 사용자가 지정한 컴퓨터 폴더에만 저장돼요. 공개 사이트·클라우드로는 올라가지 않아요.
   - 클라우드에는 '목록(파일명·분류·메모)'만 동기화돼서 다른 PC에서도 목록은 보여요.
   - 폴더 구조: 지정폴더 / 카테고리 / 연도 / 날짜_파일명
   - Chrome·Edge(PC)에서 동작. 폴더 권한은 브라우저를 다시 열면 한 번 더 눌러 허용해야 해요.            */
const FL_CATS = ['회계·예산', '인사·급여', '공문·기안', '지도점검·외부평가', '후원·모금', '시설·차량·물품', '회의·행사', '기타'];
const FL = {handle: null, perm: false, q: '', cat: '', ready: false};
function fl() { S.files ||= {cats: [], items: []}; S.files.cats ||= []; S.files.items ||= []; return S.files; }
function flCats() { return [...FL_CATS, ...fl().cats.filter(c => !FL_CATS.includes(c))]; }
const flSafe = s => String(s).replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').replace(/^\.+/, '').trim().slice(0, 120) || '파일';
function flSize(n) { n = Number(n) || 0; return n < 1024 ? n + 'B' : n < 1048576 ? (n / 1024).toFixed(0) + 'KB' : (n / 1048576).toFixed(1) + 'MB'; }
const flSupported = () => typeof window.showDirectoryPicker === 'function';

function flDb() {
  return new Promise(res => {
    try { const rq = indexedDB.open('il-hub-files', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('h'); rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null); }
    catch (e) { res(null); }
  });
}
async function flGet() { const db = await flDb(); if (!db) return null; return new Promise(res => { const r = db.transaction('h').objectStore('h').get('root'); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); }
async function flPut(h) { const db = await flDb(); if (!db) return; return new Promise(res => { const tx = db.transaction('h', 'readwrite'); h ? tx.objectStore('h').put(h, 'root') : tx.objectStore('h').delete('root'); tx.oncomplete = () => res(); tx.onerror = () => res(); }); }
async function flPerm(ask) {
  const h = FL.handle; if (!h) return false;
  try {
    let p = await h.queryPermission({mode: 'readwrite'});
    if (p !== 'granted' && ask) p = await h.requestPermission({mode: 'readwrite'});
    FL.perm = p === 'granted';
  } catch (e) { FL.perm = false; }
  return FL.perm;
}
async function flInit() { FL.handle = await flGet(); if (FL.handle) await flPerm(false); FL.ready = true; }
async function flPick() {
  if (!flSupported()) { toast('이 브라우저는 폴더 지정이 안 돼요. PC의 Chrome·Edge에서 열어 주세요'); return false; }
  try { const h = await window.showDirectoryPicker({mode: 'readwrite', id: 'il-hub-files'}); FL.handle = h; await flPut(h); FL.perm = true; toast('폴더를 지정했어요: ' + h.name); return true; }
  catch (e) { if (e && e.name !== 'AbortError') toast('폴더를 열 수 없어요 (' + (e.name || '오류') + '). 배포 사이트에서 다시 시도해 주세요'); return false; }
}
async function flEnsure() { if (!FL.handle) return (await flPick()); if (FL.perm) return true; return await flPerm(true); }
async function flDir(cat, year, create) {
  let d = await FL.handle.getDirectoryHandle(flSafe(cat), {create});
  if (year) d = await d.getDirectoryHandle(String(year), {create});
  return d;
}
async function flExists(dir, name) { try { await dir.getFileHandle(name); return true; } catch (e) { return false; } }
async function flSaveFile(file, cat, memo, link) {
  const dt = new Date(file.lastModified || Date.now()), now = ymd(today()), year = now.slice(0, 4);
  const dir = await flDir(cat, year, true);
  let base = flSafe(file.name), name = now + '_' + base, n = 1;
  while (await flExists(dir, name)) { n++; const dot = base.lastIndexOf('.'); name = now + '_' + (dot > 0 ? base.slice(0, dot) + '(' + n + ')' + base.slice(dot) : base + '(' + n + ')'); }
  const w = await (await dir.getFileHandle(name, {create: true})).createWritable();
  await w.write(file); await w.close();
  const it = {id: uid() + Date.now().toString(36), name, orig: file.name, cat, year, date: now, size: file.size, memo: memo || '', link: link || '', path: [flSafe(cat), year, name].join('/')};
  fl().items.push(it); return it;
}
async function flFile(it) {
  const parts = it.path.split('/'); let d = FL.handle;
  for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p);
  return {dir: d, fh: await d.getFileHandle(parts[parts.length - 1])};
}
async function flOpen(it, dl) {
  if (!(await flEnsure())) return;
  try {
    const {fh} = await flFile(it), f = await fh.getFile(), url = URL.createObjectURL(f);
    const viewable = /\.(pdf|png|jpe?g|gif|webp|txt)$/i.test(it.name);
    if (viewable && !dl) window.open(url, '_blank'); else { const a = document.createElement('a'); a.href = url; a.download = it.orig || it.name; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { toast('이 컴퓨터의 지정폴더에서 파일을 찾지 못했어요 (다른 PC이거나 옮겨졌을 수 있어요)'); }
}
async function flMove(it, cat) {
  if (!(await flEnsure())) return;
  try {
    const {dir, fh} = await flFile(it), f = await fh.getFile(), nd = await flDir(cat, it.year, true);
    let name = it.name, n = 1; while (await flExists(nd, name)) { n++; name = it.name.replace(/(\.[^.]*)?$/, '(' + n + ')$1'); }
    const w = await (await nd.getFileHandle(name, {create: true})).createWritable(); await w.write(f); await w.close();
    await dir.removeEntry(it.name);
    it.cat = cat; it.name = name; it.path = [flSafe(cat), it.year, name].join('/'); save(); toast('옮겼어요');
  } catch (e) { toast('옮기지 못했어요. 이 컴퓨터에 파일이 있는지 확인해 주세요'); }
}
async function flRemove(it, withFile) {
  if (withFile && (await flEnsure())) { try { const {dir} = await flFile(it); await dir.removeEntry(it.name); } catch (e) {} }
  fl().items = fl().items.filter(x => x.id !== it.id); save();
}
/* 폴더를 읽어 목록에 없는 파일을 추가하고, 없어진 파일은 표시 */
async function flScan() {
  if (!(await flEnsure())) return;
  let added = 0; const seen = new Set();
  try {
    for await (const [cn, ch] of FL.handle.entries()) {
      if (ch.kind !== 'directory' || cn.startsWith('.') || cn.startsWith('_')) continue;
      for await (const [yn, yh] of ch.entries()) {
        if (yh.kind !== 'directory') continue;
        for await (const [fn, fh] of yh.entries()) {
          if (fh.kind !== 'file') continue;
          const path = [cn, yn, fn].join('/'); seen.add(path);
          if (!fl().items.some(i => i.path === path)) {
            const f = await fh.getFile(); const m = fn.match(/^(\d{4}-\d{2}-\d{2})_/);
            fl().items.push({id: uid() + Date.now().toString(36), name: fn, orig: m ? fn.slice(11) : fn, cat: cn, year: yn, date: m ? m[1] : ymd(new Date(f.lastModified)), size: f.size, memo: '', link: '', path}); added++;
            if (!flCats().includes(cn)) fl().cats.push(cn);
          }
        }
      }
    }
  } catch (e) { toast('폴더를 읽는 중 오류가 났어요'); return; }
  fl().items.forEach(i => { i.missing = !seen.has(i.path); });
  save(); toast(added ? `목록에 ${added}개를 추가했어요` : '목록이 폴더와 같아요');
}

/* ---------- 작은 zip 도구 ---------- */
const WLZ = {crc: null};
function zCrc(u8) {
  if (!WLZ.crc) { WLZ.crc = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; WLZ.crc[n] = c >>> 0; } }
  let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = WLZ.crc[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0;
}
async function zInflate(u8) {
  const ds = new DecompressionStream('deflate-raw'), w = ds.writable.getWriter(); w.write(u8); w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function zRead(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder(); let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip이 아니에요');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const out = [];
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl)); p += 46 + nl + xl + cl;
    const ls = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true), raw = u8.subarray(ls, ls + csize);
    if (name.endsWith('/')) continue;
    out.push({name, data: method === 0 ? raw.slice() : await zInflate(raw)});
  }
  return out;
}
function zWrite(files) {
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const u16 = v => [v & 255, (v >> 8) & 255], u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  files.forEach(f => {
    const nm = enc.encode(f.name), crc = zCrc(f.data), sz = f.data.length;
    const lh = new Uint8Array([0x50, 0x4b, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0), ...nm]);
    parts.push(lh, f.data);
    cen.push(new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off), ...nm]));
    off += lh.length + sz;
  });
  const cs = cen.reduce((a, b) => a + b.length, 0);
  return new Blob([...parts, ...cen, new Uint8Array([0x50, 0x4b, 5, 6, 0, 0, 0, 0, ...u16(files.length), ...u16(files.length), ...u32(cs), ...u32(off), 0, 0])], {type: 'application/hwp+zip'});
}

/* ---------- 양식 저장 (이 기기 IndexedDB) ---------- */
async function wlTplGet() { const db = await flDb(); if (!db) return null; return new Promise(res => { const r = db.transaction('h').objectStore('h').get('wl-tpl'); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); }
async function wlTplPut(v) { const db = await flDb(); if (!db) return false; return new Promise(res => { const tx = db.transaction('h', 'readwrite'); tx.objectStore('h').put(v, 'wl-tpl'); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); }

/* ---------- hwpx 만들기 ---------- */
const xEsc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function wlLines(content) { return String(content || '').split('\n').map(s => s.trim().replace(/^[-·•]\s*/, '')).filter(Boolean); }
function wlDateText(k) { const d = parseYmd(k); return `${d.getFullYear()} 년  ${d.getMonth() + 1}월  ${d.getDate()}일  ${DOW[d.getDay()]}요일`; }
/* '라벨' 글자가 든 칸의 다음 칸(tc)에서 subList 안쪽 범위를 찾는다 */
function wlCell(xml, label) {
  const at = xml.indexOf('<hp:t>' + label + '</hp:t>'); if (at < 0) return null;
  const tc = xml.indexOf('<hp:tc ', at); if (tc < 0) return null;
  const a = xml.indexOf('>', xml.indexOf('<hp:subList', tc)) + 1, b = xml.indexOf('</hp:subList>', a);
  return a > 0 && b > a ? [a, b] : null;
}
function wlParas(lines, proto, step) {
  const one = t => proto.replace(/<hp:run([^>]*?)(\/>|>[\s\S]*?<\/hp:run>)/, (m, at) => `<hp:run${at}>${t ? '<hp:t>' + xEsc(t) + '</hp:t>' : ''}</hp:run>`)
    .replace(/vertpos="\d+"/, 'vertpos="__V__"').replace(/ id="\d+"/, ' id="0"');
  return (lines.length ? lines : ['']).map((t, i) => one(t).replace('__V__', String(i * step))).join('');
}
async function wlHwpxBuild(tpl, k, content, note) {
  const files = await zRead(tpl.buf), dec = new TextDecoder(), enc = new TextEncoder();
  const sec = files.find(f => /Contents\/section0\.xml$/.test(f.name)); if (!sec) throw new Error('양식에 본문이 없어요');
  let xml = dec.decode(sec.data);
  const lines = wlLines(content), items = lines.map(t => ' - ' + t);
  // 날짜
  const dt = wlDateText(k); let hit = false;
  xml = xml.replace(/<hp:t>\s*\d{4}\s*년\s*\d+\s*월\s*\d+\s*일\s*[^<]*요일\s*<\/hp:t>/, () => { hit = true; return `<hp:t>${dt}</hp:t>`; });
  if (!hit) throw new Error('양식에서 날짜 칸을 찾지 못했어요 (예: 2026 년 9월 1일 화요일)');
  // 업무내용·비고
  for (const [label, arr] of [['업무내용', items], ['비고', String(note || '').trim() ? String(note).split('\n').map(s => s.trim()).filter(Boolean) : []]]) {
    const r = wlCell(xml, label); if (!r) throw new Error(`양식에서 '${label}' 칸을 찾지 못했어요`);
    const inner = xml.slice(r[0], r[1]), pm = inner.match(/<hp:p [\s\S]*?<\/hp:p>/); if (!pm) throw new Error(`'${label}' 칸 형식이 달라요`);
    const step = Number((pm[0].match(/vertsize="(\d+)"/) || [0, 1000])[1]) * 1.6;
    xml = xml.slice(0, r[0]) + wlParas(arr, pm[0], Math.round(step)) + xml.slice(r[1]);
  }
  sec.data = enc.encode(xml);

function ledgerHeader(rows) {

/* 계정이 열이 아니라 "구획 제목 줄"로 나오는 원장 대응: 날짜·금액 없는 줄의 글자를 계정으로 */
function parseLedger(rows, hdr, mp, y = bgState().year) {
  const dt = v => { const d = toYmd(v); if (d) return d; const m = String(v ?? '').trim().match(/^(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})일?$/); return m && Number(m[1]) <= 12 ? `${y}-${pad(m[1])}-${pad(m[2])}` : null; };

    const line = texts.join(' ');

        const t = texts.find(x => /계정|과목|\[\d+\]|^\d{3,}\s*\S/.test(x)) || (texts.length <= 2 ? texts[0] : '');
        if (t && !LFIELD.date.re.test(t)) acct = t.replace(/^.*?(계정과목|계정명|계정)\s*[:：]?\s*/, '').trim();

/* ---------- 집계 ---------- */
function linesOf(fund, y = bgState().year) { return bgState().lines.filter(l => l.fund === fund && Number(l.y) === Number(y)); }
function matchLine(fund, y, acct, proj, memo) {
  const b = bgState(), n = bnorm(acct), al = b.alias[`${fund}|${y}|${n}`];
  const cands = linesOf(fund, y).filter(l => bnorm(l.mok) === (al || n));
  if (!cands.length) return null;
  if (cands.length === 1) return cands[0];
  const pj = bnorm(proj), m = String(memo || '');
  const byProj = cands.find(l => l.proj && pj && (bnorm(l.proj) === pj || pj.includes(bnorm(l.proj)) || bnorm(l.proj).includes(pj)));
  if (byProj) return byProj;
  const byKw = cands.find(l => l.proj && [l.proj, ...String(l.kw || '').split(',')].map(x => x.trim()).filter(x => x.length >= 2).some(k => m.includes(k)));
  if (byKw) return byKw;

}
/* 결과: {byLine:{id:{amt,mon[12],rows[]}}, unmatched:{acct:{n,dr,cr,rows}}, unassigned:{mok:{amt,rows}}, lastMon} */
function computeFund(fund, y = bgState().year) {
  const b = bgState(), L = b.ledgers[`${fund}|${y}`], res = {byLine:{}, unmatched:{}, unassigned:{}, lastMon: 0, has: !!L};
  if (!L) return res;
  res.lastMon = Number(String(L.to || '').slice(0, 2)) || 0;
  L.rows.forEach(r => {
    const [md, acct, proj, dr, cr, memo] = r, mon = Number(md.slice(0, 2)) - 1;
    const l = matchLine(fund, y, acct, proj, memo);
    if (!l) { const u = res.unmatched[acct] ||= {n: 0, dr: 0, cr: 0, rows: []}; u.n++; u.dr += dr; u.cr += cr; u.rows.push(r); return; }
    const amt = l.type === 'in' ? cr - dr : dr - cr;
    if (l.unassigned) { const u = res.unassigned[l.mok] ||= {amt: 0, rows: [], type: l.type}; u.amt += amt; u.rows.push(r); return; }
    const x = res.byLine[l.id] ||= {amt: 0, mon: Array(12).fill(0), rows: []};

}

  Object.values(c.unassigned).forEach(u => { (sum[u.type] || sum.out).used += u.amt; });

}

}

      p.cur += curBudget(l); p.base += Number(l.base) || 0; p.used += (c.byLine[l.id] || {}).amt || 0; p.lines.push(l); if (l.owner && !p.owner) p.owner = l.owner; });
