<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F5F6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="업무허브">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>구로IL 업무허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ground:#F3F5F2; --surface:#FFFFFF; --sunk:#E9EDE8; --line:#D5DCD5; --line-strong:#B9C3BA;
  --ink:#1B2420; --ink-2:#4F5C55; --ink-3:#7A867F;
  --accent:#1F5F6B; --accent-ink:#FFFFFF; --accent-soft:#DCEBEC;
  --stamp:#B23A2E; --stamp-soft:#F6E1DD;
  --warn:#9A6A12; --warn-soft:#F5EACF;
  --ok:#2E6B3F; --ok-soft:#DDEEDF;
  --cat-tax:#7A4E9E; --cat-pay:#1F5F6B; --cat-ins:#2E6B3F; --cat-acc:#9A6A12; --cat-don:#B4527A; --cat-etc:#5E6A64; --cat-leave:#3E7CB1; --cat-bday:#C0673A;
  --paper:#FFFFFF; --paper-ink:#111;
  --shadow:0 1px 2px rgba(20,35,30,.06),0 4px 14px rgba(20,35,30,.06);
  --radius:10px;
  --f-display:"Hahmlet","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121716; --surface:#1A211F; --sunk:#222B28; --line:#2E3935; --line-strong:#43504B;
    --ink:#E4EBE7; --ink-2:#A9B6AF; --ink-3:#7F8C86;
    --accent:#72B6C2; --accent-ink:#0E1A1C; --accent-soft:#1E3538;
    --stamp:#E57A6C; --stamp-soft:#3A2220;
    --warn:#D9AE55; --warn-soft:#352C18;
    --ok:#7CC08E; --ok-soft:#1C3222;
    --cat-tax:#B794D6; --cat-pay:#72B6C2; --cat-ins:#7CC08E; --cat-acc:#D9AE55; --cat-don:#E08DB0; --cat-etc:#9AA7A1; --cat-leave:#86B6E0; --cat-bday:#E59A6E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121716; --surface:#1A211F; --sunk:#222B28; --line:#2E3935; --line-strong:#43504B;
  --ink:#E4EBE7; --ink-2:#A9B6AF; --ink-3:#7F8C86;
  --accent:#72B6C2; --accent-ink:#0E1A1C; --accent-soft:#1E3538;
  --stamp:#E57A6C; --stamp-soft:#3A2220;
  --warn:#D9AE55; --warn-soft:#352C18;
  --ok:#7CC08E; --ok-soft:#1C3222;
  --cat-tax:#B794D6; --cat-pay:#72B6C2; --cat-ins:#7CC08E; --cat-acc:#D9AE55; --cat-don:#E08DB0; --cat-etc:#9AA7A1; --cat-leave:#86B6E0; --cat-bday:#E59A6E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:20px 14px;gap:18px}
.brand{padding:0 8px}
.brand b{display:block;font:700 19px/1.2 var(--f-display);letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 8px}
.main{min-width:0;padding-block:24px 48px;padding-inline:clamp(16px,3vw,40px)}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{margin:0;font:700 clamp(22px,3vw,28px)/1.2 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--ink-2)}
.tabbar{display:none}

@media (max-width: 860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-block:16px 96px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);text-decoration:none;padding:4px 0;position:relative}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:600}
  .tabbar svg{width:22px;height:22px}
  .tabbar .dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--stamp)}
}

/* ---------- primitives ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2,.panel-h h3{margin:0;font:600 15px/1.3 var(--f-body)}
.panel-b{padding:16px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-2>*,.grid-3>*,.doc-layout>*{min-width:0}
@media (max-width: 980px){.grid-3{grid-template-columns:1fr 1fr}}
@media (max-width: 700px){.grid-2,.grid-3{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--stamp);border-color:var(--stamp)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--stamp-soft);color:var(--stamp)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--stamp);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.dotcat{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2);font-weight:500}
.inp,select.inp,textarea.inp{height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);width:100%;min-width:0;font-size:14px;color:var(--ink)}
textarea.inp{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.form-grid .span2{grid-column:span 2}
@media (max-width: 420px){.form-grid .span2{grid-column:auto}}

.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
.tbl th{background:var(--sunk);font-weight:600;color:var(--ink-2);font-size:12px;position:sticky;top:0}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.wrap{white-space:normal;min-width:160px}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:600;background:var(--sunk)}

.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.note{padding:10px 12px;border-radius:8px;background:var(--sunk);color:var(--ink-2);font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note b{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:860px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

.sheet-back{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet .panel-b{display:flex;flex-direction:column;gap:12px}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}

/* ---------- home ---------- */
.today-strip{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:18px 20px}
.datebox{text-align:center;border-right:1px solid var(--line);padding-right:20px}
.datebox .d{font:700 44px/1 var(--f-display);color:var(--accent)}
.datebox .m{font-size:12px;color:var(--ink-3);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi .v{font:600 24px/1.1 var(--f-body);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink-3)}
.kpi.crit .v{color:var(--stamp)} .kpi.warn .v{color:var(--warn)}
@media (max-width:700px){.today-strip{grid-template-columns:1fr}.datebox{border-right:0;border-bottom:1px solid var(--line);padding:0 0 12px;display:flex;align-items:baseline;gap:10px;text-align:left}.kpis{grid-template-columns:repeat(2,1fr)}}

.dl{list-style:none;margin:0;padding:0}
.dl li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.dl li:last-child{border-bottom:0}
.dl .when{font-size:12px;line-height:1.25}
.dl .when b{display:block;font:600 15px/1.2 var(--f-body);font-variant-numeric:tabular-nums}
.dl .t{font-weight:500}
.dl .s{font-size:12px;color:var(--ink-3)}
.dl li.done .t{text-decoration:line-through;color:var(--ink-3)}
.check{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line-strong);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:15px;height:15px}

.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.app{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-decoration:none;color:var(--ink);min-height:112px;position:relative}
a.app:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.app .ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font:700 15px var(--f-display)}
.app .n{font-weight:600}
.app .dsc{font-size:12px;color:var(--ink-3);line-height:1.4}
.app .st{margin-top:auto}
.app .edit{position:absolute;top:8px;right:8px}

.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{padding:6px 8px;font-size:12px;color:var(--ink-3);font-weight:600;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
.cal .cell{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;background:var(--surface)}
.cal .cell:hover{background:var(--sunk)}
.cal .cell.out{background:var(--ground);color:var(--ink-3)}
.cal .cell .dn{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:4px;align-items:center}
.cal .cell.hol .dn,.cal .cell.sun .dn{color:var(--stamp)}
.cal .cell.sat .dn{color:var(--accent)}
.cal .cell.today .dn span.n{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px}
.cal .hn{font-size:10px;color:var(--stamp);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{font-size:11.5px;line-height:1.3;padding:2px 5px;border-radius:4px;background:var(--sunk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--cat-etc)}
.ev.done{opacity:.5;text-decoration:line-through}
.ev.x{background:transparent;border-left-style:dotted;color:var(--ink-2)}
.cal-more{font-size:11px;color:var(--ink-3)}
@media (max-width:700px){
  .cal .cell{min-height:52px;padding:4px}
  .cal .ev{display:none}
  .cal .hn{display:none}
  .cal .pips{display:flex;gap:2px;flex-wrap:wrap}
}
.pips{display:none}
.pips i{width:6px;height:6px;border-radius:50%;display:block}

/* ---------- routines ---------- */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li .tx{padding-top:3px}
.steps li.on .tx{color:var(--ink-3);text-decoration:line-through}
.steps .lnk{margin-left:auto;font-size:12px;white-space:nowrap}

/* ---------- bridge ---------- */
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--ground)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .fn{font-weight:600;word-break:break-all}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.stat{padding:12px;border-radius:8px;background:var(--sunk)}
.stat .v{font:600 20px/1.1 var(--f-body);font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--ink-3)}
.stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)} .stat.crit .v{color:var(--stamp)}
tr.entered td{color:var(--ink-3)}
tr.entered td.t{text-decoration:line-through}
.copyc{cursor:pointer;border-bottom:1px dashed var(--line-strong)}
.copyc:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- documents ---------- */
.doc-layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start}
@media (max-width:980px){.doc-layout{grid-template-columns:1fr}}
.preview-wrap{background:var(--sunk);border-radius:var(--radius);padding:16px;overflow:auto;border:1px solid var(--line)}
.a4{background:var(--paper);color:var(--paper-ink);width:210mm;min-height:297mm;padding:22mm 20mm;margin:0 auto;box-shadow:var(--shadow);font:14px/1.7 "Noto Serif KR","Hahmlet","Batang",serif;position:relative}
.a4-scale{transform-origin:top left}
.a4 h1{text-align:center;font:700 30px/1.3 "Hahmlet",serif;letter-spacing:.5em;margin:10mm 0 12mm;padding-left:.5em}
.a4 .docno{font:12px var(--f-mono);color:#444}
.a4 table.dt{width:100%;border-collapse:collapse;margin:6mm 0;font-size:14px}
.a4 table.dt th,.a4 table.dt td{border:1px solid #333;padding:9px 10px;text-align:left;vertical-align:middle}
.a4 table.dt th{background:#f1f1f1;width:24%;font-weight:600;text-align:center}
.a4 .cert{text-align:center;margin:16mm 0 6mm;font-size:16px}
.a4 .date{text-align:center;font-size:16px;margin:10mm 0}
.a4 .issuer{text-align:center;font:700 20px/1.6 "Hahmlet",serif;margin-top:12mm;position:relative}
.a4 .seal{display:inline-block;width:18mm;height:18mm;border:2px solid #c0392b;border-radius:3px;color:#c0392b;font:600 11px/1.15 "Hahmlet",serif;vertical-align:middle;margin-left:4mm;padding-top:3mm;text-align:center}
.a4 .appr{float:right;border-collapse:collapse;margin-bottom:6mm}
.a4 .appr td{border:1px solid #333;width:21mm;text-align:center;font-size:12px;padding:3px}
.a4 .appr tr:last-child td{height:15mm}
.a4 .appr td.lab{width:8mm;writing-mode:vertical-rl;letter-spacing:.3em;background:#f1f1f1}
.a4 .body{white-space:pre-wrap}
.a4 .clear{clear:both}
.a4 .amount-big{font:700 18px/1.4 "Hahmlet",serif}

@media print{
  body{background:#fff}
  .shell>.side,.tabbar,.no-print,.toast{display:none!important}
  .main{padding:0!important}
  .page>*:not(.print-host){display:none!important}
  .print-host .doc-form{display:none!important}
  .print-host,.print-host *{visibility:visible}
  .doc-layout{display:block}
  .preview-wrap{background:none;border:0;padding:0;overflow:visible}
  .a4-scale{transform:none!important;height:auto!important}
  .a4{box-shadow:none;margin:0;width:auto;min-height:auto;page-break-after:always}
  .a4:last-child{page-break-after:auto}
  @page{size:A4;margin:0}
}
</style>

</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><b>구로IL 업무허브</b><span>사무행정팀 · 김휘원</span></div>
    <button class="btn" id="side-search" style="justify-content:flex-start;color:var(--ink-3)" onclick="openSearch()">검색 <span class="mono small" style="margin-left:auto">Ctrl K</span></button>
    <nav class="nav" id="nav-side"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  const def = defaults();

  // merge shallowly so new default keys appear after updates
  for (const k of Object.keys(def)) if (saved[k] === undefined) saved[k] = def[k];
  saved.settings = Object.assign({}, def.settings, saved.settings);
  saved.settings.org = Object.assign({}, def.settings.org, saved.settings.org);

    const mine = (saved.apps || []).filter(a => !/^a\d$/.test(a.id));

  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400);
}
async function copyText(txt, label = '복사했어요') {
  try { await navigator.clipboard.writeText(txt); toast(label); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); toast(ok ? label : '복사가 막혀 있어요. 직접 선택해 복사해 주세요'); return ok;
  }
}

  const blob = data instanceof Blob ? data : new Blob([data], {type: mime});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();

}

/* ---------- schedule expansion ---------- */
const isHoliday = d => { const k = ymd(d); return !!S.holidays[k]; };
const isOff = d => d.getDay() === 0 || d.getDay() === 6 || isHoliday(d);
function shiftDay(d, how) {
  if (how === 'none') return d;
  let x = new Date(d), step = how === 'prev' ? -1 : 1, guard = 0;
  while (isOff(x) && guard++ < 14) x = addDays(x, step);
  return x;
}
function ruleDay(rule, y, m) { // m: 0-based
  const last = new Date(y, m+1, 0).getDate();
  let day = rule.day === 'payday' ? Number(S.settings.payday) : rule.day === 'last' ? last : Number(rule.day);
  return new Date(y, m, Math.min(day, last));
}
// returns [{rule, date(Date), orig(Date), key}]
function occurrences(from, to) {
  const out = [];
  for (const r of S.rules) {
    if (r.off) continue;
    if (r.type === 'once') {
      const d = parseYmd(r.date);
      if (d >= from && d <= to) out.push(mk(r, d, d));
      continue;
    }
    let y = from.getFullYear(), m = from.getMonth() - 1; // start 1 month earlier to catch shifted dates
    const endY = to.getFullYear(), endM = to.getMonth() + 1;
    while (y < endY || (y === endY && m <= endM)) {
      const yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12;
      if (r.type === 'monthly' || (r.type === 'yearly' && Number(r.month) - 1 === mm)) {
        const orig = ruleDay(r, yy, mm), d = shiftDay(orig, r.shift);
        if (d >= from && d <= to) out.push(mk(r, d, orig));
      }
      m++; if (m >= 12) { m -= 12; y++; }
    }
  }
  return out.sort((a, b) => a.date - b.date || a.rule.title.localeCompare(b.rule.title));
  function mk(rule, date, orig) { const key = rule.id + '@' + ymd(orig); return {rule, date, orig, key, done: !!S.done[key]}; }
}
function overdueList() {
  const t = today(), since = S.settings.since ? parseYmd(S.settings.since) : addDays(t, -45);
  const from = since > addDays(t, -45) ? since : addDays(t, -45);
  return occurrences(from, addDays(t, -1)).filter(o => !o.done);
}
function overdueCount() { try { return overdueList().length; } catch (e) { return 0; } }
function dday(d) {
  const n = Math.round((d - today()) / 864e5);
  return n === 0 ? '오늘' : n > 0 ? `D-${n}` : `D+${-n}`;
}
function toggleDone(key) { if (S.done[key]) delete S.done[key]; else S.done[key] = Date.now(); save(); }

/* ---------- routine periods ---------- */
function periodKey(rt, d = today()) {
  if (rt.freq === 'monthly') return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  if (rt.freq === 'yearly') { const s = d.getMonth() >= 9 ? d.getFullYear() : d.getFullYear() - 1; return `${s}년 말~${s+1}년 초`; } // 10월에 새 사이클 시작
  return S.checks[rt.id + ':adhoc-cur'] || '1차';
}
function routineState(rt, period = periodKey(rt)) {
  const arr = S.checks[rt.id + '@' + period] || [];
  const done = rt.steps.filter((_, i) => arr[i]).length;
  return {period, arr, done, total: rt.steps.length};
}

   토큰·비밀번호 키는 절대 읽지 않는다. 쓰기(수정)는 하지 않는다. */
const GH = {owner:'kittycong', raw:'https://raw.githubusercontent.com/kittycong'};
const CONN = {

  birth:{name:'생일 관리', repo:'birth_guro1', status:'idle', data:null, src:''},
};
function lsRead(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
async function getText(urls) {
  for (const u of urls) { try { const r = await fetch(u, {cache:'no-store'}); if (r.ok) return {text: await r.text(), url: u}; } catch (e) {} }
  return null;
}
async function loadConnectors() {
  const sameOrigin = location.hostname === `${GH.owner}.github.io`;
  // ---- 휴가 (guro_huga) ----
  const H = CONN.huga; H.status = 'loading';
  let hd = null;
  const draft = lsRead('guro_huga_local_draft');
  if (draft && Array.isArray(draft.records)) { hd = draft; H.src = '휴가 앱 (이 브라우저의 최신 작업본)'; }
  if (!hd && ENV !== 'artifact') {
    const t = await getText([...(sameOrigin ? ['/guro_huga/data/app-data.json'] : []), `${GH.raw}/guro_huga/main/data/app-data.json`]);
    if (t) { try { hd = JSON.parse(t.text); H.src = t.url.startsWith('/') ? '휴가 앱 공유 데이터' : 'GitHub 공유 데이터 (data/app-data.json)'; } catch (e) {} }
  }
  if (!hd && S.imports?.huga) { hd = S.imports.huga; H.src = '가져온 파일'; }
  H.data = hd; H.status = hd ? 'ok' : 'none';
  // ---- 생일 (birth_guro1) ----
  const Bd = CONN.birth; Bd.status = 'loading';
  let bd = lsRead('guro_birthdays'); if (Array.isArray(bd) && bd.length) Bd.src = '생일 앱 (이 브라우저)'; else bd = null;
  if (!bd && ENV !== 'artifact') {
    const t = await getText([...(sameOrigin ? ['/birth_guro1/index.html'] : []), `${GH.raw}/birth_guro1/main/index.html`]);
    const m = t && t.text.match(/INITIAL_DATA\s*=\s*(\[[\s\S]*?\]);/);
    if (m) { try { bd = JSON.parse(m[1]); Bd.src = '생일 앱 기본 명단'; } catch (e) {} }
  }
  if (!bd && S.imports?.birth) { bd = S.imports.birth; Bd.src = '가져온 파일'; }
  Bd.data = bd; Bd.status = bd ? 'ok' : 'none';
}

/* ---------- 휴가 계산 (guro_huga의 leaveDelta와 동일 규칙) ---------- */
function leaveDelta(type) { if (type === '반차') return 0.5; if (type === '반반차') return 0.25; if (['교육','출장','개인일정'].includes(type)) return 0; return 1; }
function hugaEmp(id) { return (CONN.huga.data?.employees || []).find(e => e.id === id); }
function leaveEvents(from, to) {
  const d = CONN.huga.data; if (!d) return [];
  const a = ymd(from), b = ymd(to);
  return (d.records || []).filter(r => r.date >= a && r.date <= b).map(r => ({kind:'leave', date: parseYmd(r.date), title: `${hugaEmp(r.empId)?.name || '직원'} ${r.type}`, rec: r}));
}
function leaveBalance() {
  const d = CONN.huga.data; if (!d) return [];
  const y = today().getFullYear();
  return (d.employees || []).filter(e => !e.resignationDate).map(e => {
    const used = (d.records || []).filter(r => r.empId === e.id && r.date.startsWith(String(y))).reduce((s, r) => s + leaveDelta(r.type), 0);
    const grant = (d.subLeaves || []).filter(s => s.empId === e.id && s.type === 'grant' && s.date.startsWith(String(y))).reduce((s, x) => s + Number(x.days || 0), 0);
    const total = d.totals?.[`${e.id}_${y}`];
    return {name: e.name, dept: e.dept, used: Math.round(used * 100) / 100, total: total == null || total === '' ? null : Number(total) + grant, left: total == null || total === '' ? null : Math.round((Number(total) + grant - used) * 100) / 100};
  });
}
/* ---------- 생일 ---------- */
function birthdayEvents(from, to) {
  const list = CONN.birth.data; if (!list) return [];
  const out = [];
  for (let y = from.getFullYear(); y <= to.getFullYear(); y++)
    list.forEach(p => { const d = new Date(y, Number(p.m) - 1, Number(p.d)); if (d >= from && d <= to) out.push({kind:'bday', date:d, title:`${p.name} 생일`, p}); });
  return out.sort((a, b) => a.date - b.date);
}
function extraEvents(from, to) { return [...leaveEvents(from, to), ...birthdayEvents(from, to)]; }

function bindConn(v) {

/* ================= calendar ================= */
let calMonth = (() => { const t = today(); return new Date(t.getFullYear(), t.getMonth(), 1); })();
let calFilter = new Set([...Object.keys(CATS), 'leave', 'bday']);

VIEWS.calendar = v => {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const start = addDays(calMonth, -calMonth.getDay());
  const end = addDays(new Date(y, m+1, 0), 6 - new Date(y, m+1, 0).getDay());
  const occ = occurrences(start, end).filter(o => calFilter.has(o.rule.cat));
  const byDay = {}; occ.forEach(o => (byDay[ymd(o.date)] ||= []).push(o));
  const xs = extraEvents(start, end).filter(e => calFilter.has(e.kind)); const xByDay = {}; xs.forEach(e => (xByDay[ymd(e.date)] ||= []).push(e));
  const tk = ymd(today());
  let cells = '';
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
    const k = ymd(d), list = byDay[k] || [], xl = xByDay[k] || [], h = S.holidays[k];
    const cls = ['cell', d.getMonth()!==m?'out':'', d.getDay()===0?'sun':'', d.getDay()===6?'sat':'', h?'hol':'', k===tk?'today':''].join(' ');
    cells += `<div class="${cls}" data-day="${k}" role="button" tabindex="0" aria-label="${d.getMonth()+1}월 ${d.getDate()}일, 일정 ${list.length}건">
      <div class="dn"><span class="n">${d.getDate()}</span>${h?`<span class="hn">${esc(h)}</span>`:''}</div>
      ${list.slice(0,3).map(o=>`<div class="ev ${o.done?'done':''}" style="border-left-color:${CATS[o.rule.cat].color}" title="${esc(o.rule.title)}">${esc(o.rule.title)}</div>`).join('')}
      ${xl.slice(0, Math.max(0, 3-list.length)).map(e=>`<div class="ev x" style="border-left-color:${XCAT[e.kind].color}" title="${esc(e.title)}">${esc(e.title)}</div>`).join('')}
      ${list.length+xl.length>3?`<div class="cal-more">+${list.length+xl.length-3}건</div>`:''}
      <div class="pips">${list.map(o=>`<i style="background:${o.done?'var(--line-strong)':CATS[o.rule.cat].color}"></i>`).join('')}${xl.map(e=>`<i style="background:${XCAT[e.kind].color}"></i>`).join('')}</div>
    </div>`;
  }
  const monthOcc = occ.filter(o => o.date.getMonth() === m);

  v.innerHTML = `
  <div class="page-head"><div><h1>마감 캘린더</h1><p>법정·정기 마감이 매달 자동으로 잡히고, 주말·공휴일이면 규칙에 따라 앞뒤로 옮겨집니다.</p></div>
    <div class="row"><button class="btn" id="ics">${icon('down')}NAS 캘린더용 .ics</button><button class="btn primary" id="add-rule">${icon('plus')}일정·규칙 추가</button></div></div>

  <section class="panel">
    <div class="panel-h">
      <div class="row"><button class="btn ghost sm" id="prev" aria-label="이전 달">${icon('left')}</button>
        <h2 class="num" style="min-width:104px;text-align:center;font:700 18px var(--f-display)">${y}년 ${m+1}월</h2>
        <button class="btn ghost sm" id="next" aria-label="다음 달">${icon('right')}</button><button class="btn sm" id="thism">이번 달</button></div>
      <div class="row" style="gap:6px">${Object.entries({...CATS, ...(CONN.huga.status==='ok'?{leave:XCAT.leave}:{}), ...(CONN.birth.status==='ok'?{bday:XCAT.bday}:{})}).map(([k,c])=>`<button class="chip" data-cat="${k}" aria-pressed="${calFilter.has(k)}" style="cursor:pointer;border:0;${calFilter.has(k)?'':'opacity:.4'}"><span class="dotcat" style="background:${c.color}"></span>${c.name}</button>`).join('')}</div>
    </div>
    <div style="overflow-x:auto"><div class="cal">${DOW.map((d,i)=>`<div class="dow" style="${i===0?'color:var(--stamp)':i===6?'color:var(--accent)':''}">${d}</div>`).join('')}${cells}</div></div>
  </section>

  <div class="grid-2">
    <section class="panel"><div class="panel-h"><h2>${m+1}월 마감 목록</h2><span class="faint small">${monthOcc.filter(o=>o.done).length}/${monthOcc.length} 완료</span></div>
      ${monthOcc.length?`<ul class="dl" id="mlist">${monthOcc.map(o=>deadlineItem(o)).join('')}</ul>`:'<div class="empty">이 달에는 마감이 없어요</div>'}</section>
    <section class="panel"><div class="panel-h"><h2>반복 규칙 ${S.rules.length}개</h2><span class="faint small">센터 기준에 맞게 날짜를 고쳐 쓰세요</span></div>
      <div class="tbl-wrap" style="border:0;border-radius:0;max-height:520px;overflow:auto"><table class="tbl"><thead><tr><th>일정</th><th>주기</th><th>휴일이면</th><th></th></tr></thead><tbody>
      ${S.rules.map(r=>`<tr style="${r.off?'opacity:.45':''}"><td class="wrap"><span class="dotcat" style="background:${CATS[r.cat].color};margin-right:6px"></span>${esc(r.title)}</td><td>${ruleText(r)}</td><td>${{prev:'앞당김',next:'미룸',none:'그대로'}[r.shift]}</td><td><button class="btn ghost sm" data-edit-rule="${r.id}">편집</button></td></tr>`).join('')}
      </tbody></table></div></section>
  </div>`;

  $('#prev').onclick = () => { calMonth = new Date(y, m-1, 1); render(); };
  $('#next').onclick = () => { calMonth = new Date(y, m+1, 1); render(); };
  $('#thism').onclick = () => { const t = today(); calMonth = new Date(t.getFullYear(), t.getMonth(), 1); render(); };
  $('#add-rule').onclick = () => editRule(null);
  $('#ics').onclick = exportIcs;
  $$('[data-cat]', v).forEach(b => b.onclick = () => { const k = b.dataset.cat; calFilter.has(k) ? calFilter.delete(k) : calFilter.add(k); if (!calFilter.size) calFilter = new Set([...Object.keys(CATS), 'leave', 'bday']); render(); });
  $$('[data-edit-rule]', v).forEach(b => b.onclick = () => editRule(b.dataset.editRule));
  $$('.cal .cell', v).forEach(c => { const open = () => dayDetail(c.dataset.day, byDay[c.dataset.day] || [], xByDay[c.dataset.day] || []); c.onclick = open; c.onkeydown = e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); open(); } }; });
  const ml = $('#mlist', v); if (ml) bindDone(ml, () => render());
};
function ruleText(r) {
  const dd = r.day === 'payday' ? `${S.settings.payday}일(급여일)` : r.day === 'last' ? '말일' : `${r.day}일`;
  if (r.type === 'monthly') return `매월 ${dd}`;
  if (r.type === 'yearly') return `매년 ${r.month}월 ${dd}`;
  return r.date;
}
function dayDetail(k, list, xl = extraEvents(parseYmd(k), parseYmd(k))) {
  const d = parseYmd(k), h = S.holidays[k];
  sheet({title: `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일${h?' · '+h:''}`,
    body: (list.length ? `<ul class="dl" style="margin:-16px -16px 0">${list.map(o=>deadlineItem(o)).join('')}</ul>` : '<div class="empty">잡힌 마감이 없어요</div>') + (xl.length ? `<div style="display:flex;flex-direction:column;gap:6px;padding-top:8px">${xl.map(e=>`<div class="row small" style="gap:8px"><span class="dotcat" style="background:${XCAT[e.kind].color}"></span>${esc(e.title)}<span class="faint">${XCAT[e.kind].name} · 연동 데이터</span></div>`).join('')}</div>` : ''),
    foot: `<button class="btn" data-close>닫기</button><button class="btn primary" id="dd-add">${icon('plus')}이 날짜에 일정 추가</button>`,
    onMount: el => {
      $('#dd-add', el).onclick = () => editRule(null, k);
      el.addEventListener('click', e => { const b = e.target.closest('[data-done]'); if (!b) return; toggleDone(b.dataset.done); render(); dayDetail(k, occurrences(d, d).filter(o=>calFilter.has(o.rule.cat))); });
    }});
}
function editRule(id, date) {

    <label class="f">일정 이름<input class="inp" id="ru-t" value="${esc(r.title)}" placeholder="예: 2차 추경예산 진우 입력"></label>

      <label class="f">주기<select class="inp" id="ru-ty"><option value="monthly">매월</option><option value="yearly">매년</option><option value="once">한 번</option></select></label>
      <label class="f" data-for="yearly">월<select class="inp" id="ru-m">${[...Array(12)].map((_,i)=>`<option value="${i+1}" ${Number(r.month)===i+1?'selected':''}>${i+1}월</option>`).join('')}</select></label>
      <label class="f" data-for="monthly yearly">날짜<select class="inp" id="ru-d">${dayOpts}</select></label>
      <label class="f" data-for="once">날짜<input class="inp" type="date" id="ru-date" value="${esc(r.date||'')}"></label>

    ${id?`<label class="row small"><input type="checkbox" id="ru-off" ${r.off?'checked':''}> 이 규칙 끄기 (캘린더에 표시 안 함)</label>`:''}`,

    }});
}
function exportIcs() {
  const t = today(), occ = occurrences(new Date(t.getFullYear(), t.getMonth(), 1), addDays(t, 365));
  const e = s => String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const d8 = d => ymd(d).replace(/-/g,'');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GRCIL//Work Hub//KO','CALSCALE:GREGORIAN','X-WR-CALNAME:구로IL 행정 마감'];
  occ.forEach(o => lines.push('BEGIN:VEVENT', `UID:${o.key}@il-hub`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d8(o.date)}`, `DTEND;VALUE=DATE:${d8(addDays(o.date,1))}`,
    `SUMMARY:${e('[' + CATS[o.rule.cat].name + '] ' + o.rule.title)}`, `DESCRIPTION:${e(o.rule.note || '')}`, 'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-P2D',`DESCRIPTION:${e(o.rule.title)}`,'END:VALARM','END:VEVENT'));
  lines.push('END:VCALENDAR');
  const txt = lines.join('\r\n');
  if (CAN_FILE) { download(`구로IL_마감_${ymd(t)}.ics`, txt, 'text/calendar'); toast(`${occ.length}건을 .ics로 내보냈어요`); }
  else sheet({title:'NAS 캘린더용 .ics', body:`<div class="note">여기서는 파일 저장이 막혀 있어요. 아래 내용을 복사해 메모장에 붙여 넣고 <b>구로IL_마감.ics</b>로 저장한 뒤, 시놀로지 캘린더 → 가져오기로 넣어 주세요. (GitHub 배포본에서는 바로 파일로 받아져요)</div><textarea class="inp mono" rows="10" readonly id="ics-t">${esc(txt)}</textarea>`,
    foot:`<button class="btn" data-close>닫기</button><button class="btn primary" id="ics-c">${icon('copy')}${occ.length}건 복사</button>`, onMount: el => { $('#ics-c', el).onclick = () => copyText(txt, '.ics 내용을 복사했어요'); }});
}

const SKIP_RE = /월\s*계|누\s*계|합\s*계|소\s*계|전기\s*이월|차기\s*이월|이월\s*금?$/;

/* ---------- parsing ---------- */
function toYmd(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return ymd(new Date(v.getFullYear(), v.getMonth(), v.getDate(), 12));
  if (typeof v === 'number') {
    if (v > 19000000 && v < 21000000) { const s = String(v); return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`; }
    if (v > 20000 && v < 80000 && window.XLSX) { const p = XLSX.SSF.parse_date_code(v); return `${p.y}-${pad(p.m)}-${pad(p.d)}`; }
    return null;
  }
  const s = String(v).trim();
  let m = s.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function toNum(v) {
  if (typeof v === 'number') return v;
  if (v == null) return 0;
  let s = String(v).replace(/[,\s원₩]/g, '');
  if (!s || s === '-') return 0;
  let neg = /^\(.*\)$/.test(s) || /^△|^▲/.test(s); s = s.replace(/[()△▲]/g, '');
  const n = parseFloat(s); return isNaN(n) ? 0 : (neg ? -Math.abs(n) : n);
}
function detectHeader(rows) {
  const all = Object.values(FIELD).map(f => f.re);
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const cells = rows[i].filter(c => typeof c === 'string' && c.trim());
    if (cells.length >= 3 && cells.some(c => all.some(re => re.test(c)))) return i;
  }
  return Math.max(0, rows.findIndex(r => r.some(c => c !== '')));
}
function autoMap(headers, fields) {
  const m = {}, used = new Set();
  for (const f of fields) {
    const re = FIELD[f].re;
    let idx = headers.findIndex((h, i) => !used.has(i) && re.test(String(h)));
    if (f === 'group' && idx < 0) idx = headers.findIndex((h, i) => !used.has(i) && FIELD.acct.re.test(String(h)));
    if (idx >= 0) { m[f] = idx; used.add(idx); }
  }
  // 차변이 금액으로 잡혔으면 대변을 amt2로
  return m;
}
function readWorkbook(file) {
  return new Promise((res, rej) => {
    if (!window.XLSX) return rej(new Error('엑셀 모듈을 불러오지 못했어요. 인터넷 연결을 확인해 주세요'));
    const fr = new FileReader();
    fr.onload = () => { try { res(XLSX.read(new Uint8Array(fr.result), {type:'array', cellDates:true})); } catch (e) { rej(e); } };
    fr.onerror = () => rej(fr.error); fr.readAsArrayBuffer(file);
  });
}
function setSheet(slot, wb, name) {
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});
  const f = B.files[slot]; f.sheet = name; f.rows = rows; f.hdr = detectHeader(rows);
  B.map[slot] = autoMap(rows[f.hdr] || [], MODES[B.mode].fields);
  if (recallMap(slot)) toast('지난번에 지정한 열 설정을 불러왔어요');
}
function items(slot) {
  const f = B.files[slot], mp = B.map[slot] || {}; if (!f) return [];
  const out = [];
  f.rows.slice(f.hdr + 1).forEach((r, i) => {
    const get = k => mp[k] != null ? r[mp[k]] : '';
    const date = toYmd(get('date')); if (!date) return;
    const desc = String(get('desc') ?? '').trim();
    if (SKIP_RE.test(desc) || SKIP_RE.test(String(get('acct')))) return;
    const a1 = toNum(get('amt')), a2 = mp.amt2 != null ? toNum(get('amt2')) : 0;
    const amt = a1 || a2; if (!amt) return;
    out.push({i, date, amt, abs: Math.abs(amt), side: a1 ? 'a' : 'b', desc, acct: String(get('acct') ?? '').trim(), group: String(get('group') ?? '').trim() || '(미지정)',
      kind: String(get('kind') ?? '').trim(), party: String(get('party') ?? '').trim(), fund: String(get('fund') ?? '').trim()});
  });
  return out;
}

/* ---------- reconciliation ---------- */
function reconcile() {
  let A = items('jinwoo'), Bm = items('manual');
  const months = [...new Set([...A, ...Bm].map(x => x.date.slice(0, 7)))].sort();
  if (!B.period || !months.includes(B.period)) {
    const cnt = {}; A.forEach(x => cnt[x.date.slice(0,7)] = (cnt[x.date.slice(0,7)]||0) + 1);
    B.period = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0] || months[months.length-1] || '';
  }
  if (B.period !== 'all') { A = A.filter(x => x.date.startsWith(B.period)); Bm = Bm.filter(x => x.date.startsWith(B.period)); }
  const usedB = new Set(), matched = [], near = [], diff = [];
  const idx = {}; Bm.forEach((b, i) => (idx[b.date + '|' + b.abs] ||= []).push(i));
  const restA = [];
  A.forEach(a => { const l = idx[a.date + '|' + a.abs]; const bi = l && l.find(i => !usedB.has(i)); if (bi != null) { usedB.add(bi); matched.push({a, b: Bm[bi]}); } else restA.push(a); });
  const restA2 = [];
  restA.forEach(a => {
    let best = -1, bd = 99;
    Bm.forEach((b, i) => { if (usedB.has(i) || b.abs !== a.abs) return; const dd = Math.abs((parseYmd(a.date) - parseYmd(b.date)) / 864e5); if (dd <= 3 && dd < bd) { bd = dd; best = i; } });
    if (best >= 0) { usedB.add(best); near.push({a, b: Bm[best], gap: bd}); } else restA2.push(a);
  });
  // 같은 날짜, 금액만 다른 건 (금액 불일치)
  const onlyA = [];
  restA2.forEach(a => {
    const bi = Bm.findIndex((b, i) => !usedB.has(i) && b.date === a.date);
    if (bi >= 0 && restA2.filter(x => x.date === a.date).length === 1 && Bm.filter((b, i) => !usedB.has(i) && b.date === a.date).length === 1) { usedB.add(bi); diff.push({a, b: Bm[bi], d: Bm[bi].abs - a.abs}); }
    else onlyA.push(a);
  });
  const onlyB = Bm.filter((_, i) => !usedB.has(i));
  const sum = l => l.reduce((s, x) => s + x.abs, 0);
  return {months, matched, near, diff, onlyA, onlyB, sumA: sum(A), sumB: sum(Bm), nA: A.length, nB: Bm.length};
}

function korWon(n) {
  n = Math.floor(Math.abs(Number(n) || 0)); if (!n) return '영';
  const dg = ['','일','이','삼','사','오','육','칠','팔','구'], su = ['','십','백','천'], big = ['','만','억','조'];
  let out = '', g = 0;
  while (n > 0) {
    const part = n % 10000; n = Math.floor(n / 10000);
    if (part) { let s = ''; const ds = String(part).padStart(4, '0').split('').map(Number);
      ds.forEach((d, i) => { if (d) s += dg[d] + su[3 - i]; }); out = s + big[g] + out; }
    g++;
  }
  return out;
}

  Object.values(MODES).forEach((m, i) => out.push({k:'진우 연결', t:m.title, go:() => { B.mode = Object.keys(MODES)[i]; go('bridge'); }}));
  out.push({k:'기능', t:'주간 업무 보고 만들기', go:weeklyReport});
  out.push({k:'기능', t:'NAS 캘린더용 .ics 내보내기', go:exportIcs});
  return out;
}
function openSearch() {
  const idx = searchIndex(); let sel = 0, hits = [];
  sheet({title:'빠른 검색', body:`<input class="inp" id="q" placeholder="앱·마감·루틴·직원·문서 이름 (예: 급여, 휴가, 재직)" autocomplete="off"><div id="qr" style="display:flex;flex-direction:column;max-height:50vh;overflow:auto;margin:0 -16px"></div><div class="faint small">↑↓ 이동 · Enter 열기 · Esc 닫기</div>`,
    onMount: el => {
      const q = $('#q', el), qr = $('#qr', el);
      const draw = () => {
        const w = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
        hits = (w.length ? idx.filter(x => w.every(t => (x.t + ' ' + (x.s||'') + ' ' + x.k).toLowerCase().includes(t))) : idx.filter(x => x.k === '화면' || x.k === '앱' || x.k === '기능')).slice(0, 40);
        sel = Math.min(sel, Math.max(0, hits.length - 1));
        qr.innerHTML = hits.length ? hits.map((x, i) => `<button class="qi" data-i="${i}" style="display:flex;gap:10px;align-items:center;text-align:left;border:0;background:${i===sel?'var(--accent-soft)':'transparent'};padding:9px 16px;cursor:pointer;width:100%"><span class="chip" style="min-width:64px;justify-content:center">${esc(x.k)}</span><span style="min-width:0"><b>${esc(x.t)}</b>${x.s?`<span class="faint small"> · ${esc(x.s)}</span>`:''}</span></button>`).join('') : '<div class="empty">찾는 항목이 없어요</div>';
      };
      const pick = i => { const x = hits[i]; if (!x) return; closeSheet(); x.go(); };
      q.oninput = () => { sel = 0; draw(); };
      q.onkeydown = e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, hits.length - 1); draw(); $(`[data-i="${sel}"]`, qr)?.scrollIntoView({block:'nearest'}); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); draw(); $(`[data-i="${sel}"]`, qr)?.scrollIntoView({block:'nearest'}); }
        else if (e.key === 'Enter') { e.preventDefault(); pick(sel); }
      };
      qr.onclick = e => { const b = e.target.closest('[data-i]'); if (b) pick(Number(b.dataset.i)); };
      draw();
    }});
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  else if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '') && !$('.sheet')) { e.preventDefault(); openSearch(); }
});

/* ---------- 2. 주간 업무 보고 자동 작성 ---------- */
function weekRange(d = today()) { const mon = addDays(d, -((d.getDay() + 6) % 7)); return [mon, addDays(mon, 6)]; }
function weeklyReport() {
  const [mon, sun] = weekRange(), [nMon, nSun] = [addDays(mon, 7), addDays(sun, 7)];
  const f = d => `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
  const occ = occurrences(mon, sun), next = occurrences(nMon, nSun);
  const done = occ.filter(o => o.done), open = occ.filter(o => !o.done);
  const lv = leaveEvents(mon, nSun);
  const me = S.staff[0] || {};
  const lines = [
    `[주간 업무 보고] ${mon.getFullYear()}.${mon.getMonth()+1}.${mon.getDate()} ~ ${sun.getMonth()+1}.${sun.getDate()}  ${me.dept||''} ${me.pos||''} ${me.name||''}`.trim(),
    '', '■ 이번 주 완료',
    ...(done.length ? done.map(o => `  - ${f(o.date)} ${o.rule.title}`) : ['  - (완료 표시한 마감 없음)']),
    '', '■ 이번 주 미완료 · 진행 중',
    ...(open.length ? open.map(o => `  - ${f(o.date)} ${o.rule.title}${o.date < today() ? ' (기한 지남)' : ''}`) : ['  - 없음']),
    '', '■ 루틴 진행',
    ...S.routines.filter(r => r.freq !== 'adhoc').map(r => { const st = routineState(r); return `  - ${r.name} ${st.done}/${st.total}${st.done === st.total ? ' 완료' : ''}`; }),
    '', '■ 다음 주 예정',
    ...(next.length ? next.map(o => `  - ${f(o.date)} ${o.rule.title}`) : ['  - 없음']),
    ...(lv.length ? ['', '■ 휴가 (연동)', ...lv.map(e => `  - ${f(e.date)} ${e.title}`)] : []),
  ];
  const txt = lines.join('\n');
  sheet({title:'주간 업무 보고', wide:true, body:`<div class="note small">캘린더의 완료 표시와 루틴 체크로 자동 작성했어요. 필요한 부분만 고쳐서 복사하세요.</div><textarea class="inp mono" id="wr" rows="18">${esc(txt)}</textarea>`,
    foot:`<button class="btn" data-close>닫기</button><button class="btn primary" id="wr-c">${icon('copy')}복사</button>`,
    onMount: el => { $('#wr-c', el).onclick = () => copyText($('#wr', el).value, '주간 보고를 복사했어요'); }});
}

/* ---------- 3. 앱 연결 상태 자동 점검 ---------- */
const HEALTH = {};
async function checkApps() {
  if (ENV === 'artifact') return;
  await Promise.all(S.apps.filter(a => a.url).map(async a => {
    try {
      const u = new URL(a.url, location.href), same = u.origin === location.origin;
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 8000);
      const r = await fetch(u.href, same ? {cache:'no-store', signal:ctl.signal} : {mode:'no-cors', cache:'no-store', signal:ctl.signal});
      clearTimeout(tm);
      HEALTH[a.id] = same ? (r.ok ? 'ok' : 'down') : 'ok';
    } catch (e) { HEALTH[a.id] = 'down'; }
  }));
}

/* ---------- 4. 휴가 데이터 기준일 경고 ---------- */
function hugaStaleDays() {
  const u = CONN.huga.data?.updatedAt; if (!u) return 0;
  const d = new Date(u.replace(' ', 'T')); if (isNaN(d)) return 0;
  return Math.floor((today() - d) / 864e5);
}

/* ---------- 5. 진우 연결: 열 지정 기억 ---------- */
function mapSig(slot) { const f = B.files[slot]; return f ? B.mode + ':' + (f.rows[f.hdr] || []).map(String).join('|') : ''; }
function rememberMap(slot) { const sig = mapSig(slot); if (!sig) return; S.mapPresets = S.mapPresets || {}; S.mapPresets[sig] = B.map[slot]; save(); }
function recallMap(slot) { const p = (S.mapPresets || {})[mapSig(slot)]; if (p) B.map[slot] = clone(p); return !!p; }

/* ---------- 6. 오프라인·홈 화면 앱 (GitHub 배포판) ---------- */
if (ENV === 'web' && location.protocol === 'https:' && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* ================= settings & backup ================= */
VIEWS.settings = v => {
  const st = S.settings, o = st.org;
  const hol = Object.entries(S.holidays).sort().map(([d, n]) => `${d} ${n}`).join('\n');
  v.innerHTML = `
  <div class="page-head"><div><h1>설정 · 백업</h1><p>기관 정보, 급여일, 공휴일을 고치고 데이터를 다른 기기로 옮깁니다.</p></div></div>
  <div class="grid-2">
    <section class="panel"><div class="panel-h"><h2>기관 · 문서</h2></div><div class="panel-b" style="display:flex;flex-direction:column;gap:12px">
      <div class="form-grid">
        <label class="f span2">기관명<input class="inp" id="o-name" value="${esc(o.name)}"></label>
        <label class="f">대표자(센터장)<input class="inp" id="o-rep" value="${esc(o.rep)}"></label>
        <label class="f">전화<input class="inp" id="o-tel" value="${esc(o.tel)}"></label>
        <label class="f span2">소재지<input class="inp" id="o-addr" value="${esc(o.addr)}"></label>
        <label class="f">문서번호 머리말<input class="inp" id="o-pre" value="${esc(st.docPrefix)}"></label>
        <label class="f">급여일 (매월)<input class="inp" type="number" min="1" max="31" id="o-pay" value="${esc(st.payday)}"></label>
        <label class="f span2">결재란 (쉼표로 구분)<input class="inp" id="o-appr" value="${esc(st.approvers.join(', '))}"></label>
      </div>
      <div class="row"><button class="btn primary" id="o-save">저장</button></div>
    </div></section>

    <section class="panel"><div class="panel-h"><h2>백업 · 기기 간 옮기기</h2></div><div class="panel-b" style="display:flex;flex-direction:column;gap:12px">
      <div class="note">데이터는 <b>이 브라우저</b>에만 저장돼요. PC ↔ 휴대폰, 아티팩트판 ↔ GitHub 배포본 사이에서는 백업을 내보내고 다른 쪽에서 가져오세요. 주 1회 백업 파일을 NAS에 넣어 두기를 권해요.</div>
      <div class="row">
        <button class="btn" id="bk-copy">${icon('copy')}백업 복사</button>
        <button class="btn" id="bk-dl">${icon('down')}백업 파일 저장</button>
      </div>
      <label class="f">가져오기 — 백업 내용을 붙여 넣거나 파일을 고르세요<textarea class="inp mono" id="bk-in" rows="4" placeholder='{"v":1,...}'></textarea></label>
      <div class="row"><input type="file" id="bk-file" accept=".json,application/json" class="small"><span class="grow"></span><button class="btn primary" id="bk-load">가져오기</button></div>
      <div style="border-top:1px solid var(--line);padding-top:12px" class="row"><span class="faint small grow">모든 데이터를 처음 상태로 되돌립니다</span><button class="btn danger sm" id="bk-reset">초기화</button></div>
    </div></section>
  </div>
  <section class="panel"><div class="panel-h"><h2>공휴일</h2><span class="faint small">한 줄에 "YYYY-MM-DD 이름". 마감 순연 계산에 쓰여요</span></div><div class="panel-b" style="display:flex;flex-direction:column;gap:10px">
    <textarea class="inp mono" id="hol" rows="8">${esc(hol)}</textarea><div class="row"><button class="btn" id="hol-save">공휴일 저장</button><span class="faint small">2026~2027년 기본값 포함 · 임시공휴일은 직접 추가</span></div></div></section>`;

  $('#o-save').onclick = () => {
    Object.assign(o, {name:$('#o-name').value.trim(), rep:$('#o-rep').value.trim(), tel:$('#o-tel').value.trim(), addr:$('#o-addr').value.trim()});
    st.docPrefix = $('#o-pre').value.trim() || '구로IL'; st.payday = Math.min(31, Math.max(1, Number($('#o-pay').value) || 25));
    st.approvers = $('#o-appr').value.split(',').map(s => s.trim()).filter(Boolean).slice(0, 6);
    save(); toast('저장했어요');
  };
  const dump = () => JSON.stringify(S);
  $('#bk-copy').onclick = () => copyText(dump(), '백업 내용을 복사했어요. 다른 기기의 "가져오기"에 붙여 넣으세요');
  $('#bk-dl').onclick = () => { download(`업무허브_백업_${ymd(today())}.json`, dump(), 'application/json'); if (CAN_FILE) toast('백업 파일을 저장했어요'); };
  $('#bk-file').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#bk-in').value = r.result; toast('파일을 읽었어요. "가져오기"를 누르세요'); }; r.readAsText(f); };
  $('#bk-load').onclick = () => {
    try { const d = JSON.parse($('#bk-in').value); if (!d || !d.rules || !d.settings) throw 0; S = d; const def = defaults(); for (const k of Object.keys(def)) if (S[k] === undefined) S[k] = def[k]; save(); render(); toast('가져왔어요'); }
    catch (e) { toast('백업 형식이 아니에요. 복사한 내용 전체를 붙여 넣어 주세요'); }
  };
  const rs = $('#bk-reset'); rs.onclick = () => { if (rs.dataset.armed) { S = defaults(); save(); render(); toast('초기화했어요'); } else { rs.dataset.armed = 1; rs.textContent = '한 번 더 누르면 초기화'; } };
  $('#hol-save').onclick = () => {
    const h = {}; $('#hol').value.split('\n').forEach(l => { const m = l.trim().match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/); if (m) h[m[1]] = m[2] || '공휴일'; });
    S.holidays = h; save(); toast(`공휴일 ${Object.keys(h).length}일을 저장했어요`);
  };
};

/* ================= boot ================= */
S = load();
render();
loadConnectors().then(() => { if (['home','calendar','apps'].includes(current())) render(); return checkApps(); }).then(() => { if (['home','apps'].includes(current())) render(); });

</script>
